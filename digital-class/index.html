<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ថ្នាក់ឌីជីថល</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&display=swap">
<style>
@font-face{font-family:'SiemReapLocal';src:local('Khmer OS Siemreap'),local('KhmerOS_siemreap'),local('KhmerOS Siemreap'),local('KhmerOSsiemreap');font-weight:100 900;font-style:normal}
/* ===== Design system v2 — light sidebar, indigo primary, soft surfaces ===== */
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#f1f4f9;--surface3:#e9eef6;--fg:#0f172a;--muted:#64748b;--line:#e3e8f0;--line2:#d5dce7;
  --accent:#4f46e5;--accent2:#7c3aed;--accent-fg:#ffffff;--accent-soft:#eef0ff;
  --ok:#059669;--ok-soft:#e3f6ee;--gold:#d97706;--gold-soft:#fdf1dc;--warn:#b45309;
  --danger:#dc2626;--danger-soft:#fde8e8;--blue:#2563eb;--blue-soft:#e3edfd;
  --nav:#ffffff;--nav-fg:#475569;--nav-active:#eef0ff;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
  --shadow-lg:0 12px 40px rgba(15,23,42,.14),0 2px 8px rgba(15,23,42,.06);
  --r:14px;
  --f-body:'Kantumruy Pro','SiemReapLocal','Khmer OS Siemreap','Noto Sans Khmer',system-ui,sans-serif;
  --f-doc:'SiemReapLocal','Khmer OS Siemreap','KhmerOS_siemreap','Kantumruy Pro',serif;
  --f-head:'Khmer OS Muol Light','Khmer OS Muol','Moul','Kantumruy Pro',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020;--surface:#121a2e;--surface2:#18223a;--surface3:#1f2a45;--fg:#e8ecf6;--muted:#93a0bb;--line:#232f4b;--line2:#2c3a5a;
  --accent:#8b8cf8;--accent2:#b18cfa;--accent-fg:#0b1020;--accent-soft:#1f2350;
  --ok:#34d399;--ok-soft:#0f2e25;--gold:#fbbf24;--gold-soft:#33270c;--warn:#fbbf24;
  --danger:#f87171;--danger-soft:#3a1a1f;--blue:#60a5fa;--blue-soft:#132a4a;
  --nav:#0e1528;--nav-fg:#aab5cc;--nav-active:#1f2350;
  --shadow:0 1px 2px rgba(0,0,0,.35);--shadow-lg:0 16px 48px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020;--surface:#121a2e;--surface2:#18223a;--surface3:#1f2a45;--fg:#e8ecf6;--muted:#93a0bb;--line:#232f4b;--line2:#2c3a5a;
  --accent:#8b8cf8;--accent2:#b18cfa;--accent-fg:#0b1020;--accent-soft:#1f2350;
  --ok:#34d399;--ok-soft:#0f2e25;--gold:#fbbf24;--gold-soft:#33270c;--warn:#fbbf24;
  --danger:#f87171;--danger-soft:#3a1a1f;--blue:#60a5fa;--blue-soft:#132a4a;
  --nav:#0e1528;--nav-fg:#aab5cc;--nav-active:#1f2350;
  --shadow:0 1px 2px rgba(0,0,0,.35);--shadow-lg:0 16px 48px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;padding:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.5;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
::selection{background:var(--accent-soft)}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ===== login ===== */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg)}
.lg-hero{position:relative;overflow:hidden;color:#fff;padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;
  background:radial-gradient(800px 500px at 0% 0%,#6366f1 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#a855f7 0%,transparent 55%),linear-gradient(135deg,#312e81,#4c1d95)}
.lg-hero:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 80%);pointer-events:none}
.lg-logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;position:relative;z-index:1}
.lg-logo i{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;backdrop-filter:blur(6px)}
.lg-hero h1{font-family:var(--f-head);font-weight:400;font-size:clamp(26px,3.4vw,40px);line-height:1.6;position:relative;z-index:1}
.lg-hero p{opacity:.85;max-width:460px;position:relative;z-index:1;margin:10px 0 0}
.lg-stats{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.lg-stats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 16px;min-width:110px;backdrop-filter:blur(6px)}
.lg-stats b{display:block;font-size:24px;line-height:1.3}
.lg-stats small{opacity:.8}
.lg-side{display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:440px}
.login-card h1{font-size:24px;font-weight:700}
.login-card .sub{color:var(--muted);margin:4px 0 22px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:12px 4px 10px;border-radius:12px;font-weight:600;font-size:12px;line-height:1.35;color:var(--muted);min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
.seg button:hover{border-color:var(--line2);color:var(--fg)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.in{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;min-height:42px;transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line2))}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.in:disabled{background:var(--surface2);opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;min-height:40px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-fg);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}
.btn.dng:hover{background:var(--danger-soft)}
.btn.sm{padding:4px 11px;min-height:32px;font-size:13px;border-radius:9px}
.btn.lg{min-height:48px;font-size:16px;border-radius:12px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:left}

/* ===== shell ===== */
#app{display:grid;grid-template-columns:264px 1fr;height:100%}
#nav{background:var(--nav);color:var(--nav-fg);overflow:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 12px 12px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 6px 14px}
.brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.brand b{display:block;color:var(--fg);font-size:16px;font-weight:700;line-height:1.35}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ngrp{font-size:11.5px;font-weight:700;color:var(--muted);opacity:.8;padding:14px 10px 4px;letter-spacing:.02em}
#nav a{display:flex;gap:11px;align-items:center;padding:8px 10px;margin:1px 0;color:inherit;text-decoration:none;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .12s,color .12s}
#nav a .ico{opacity:.8}
#nav a:hover{background:var(--surface2);color:var(--fg)}
#nav a.on{background:var(--nav-active);color:var(--accent);font-weight:700}
#nav a.on .ico{opacity:1}
#nav a.back{background:var(--gold-soft);color:var(--warn);font-weight:600;margin:6px 0}
#nav a.out{color:var(--danger)}
#nav a.out:hover{background:var(--danger-soft)}
#nav .sp{flex:1;min-height:12px}
#nav .ver{padding:8px 10px 0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px}
.clsw{padding:4px 2px 6px}
.clsw .in{background:var(--surface2);border-color:var(--line);font-weight:600}
#main{display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;gap:12px;align-items:center;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);position:relative;z-index:20}
#ttl{min-width:0;flex:1}
#ttl b{display:block;font-size:17px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{position:relative;width:min(380px,40vw)}
.srch .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.srch .in{padding-left:36px;padding-right:46px;background:var(--surface2);border-color:transparent}
.srch .in:focus{background:var(--surface)}
.srch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px/1 ui-monospace,monospace;color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:3px 6px;background:var(--surface)}
#sres{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:300px;max-height:min(440px,70vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;z-index:45}
#sres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:9px}
#sres button:hover,#sres button.act{background:var(--accent-soft)}
#sres small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
#sres b{font-weight:600;line-height:1.4;display:block}
#sres .hd{font-size:11.5px;color:var(--muted);padding:4px 8px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent);font-size:14px}
.av.f{background:#fce7f3;color:#be185d}
:root[data-theme="dark"] .av.f{background:#3b1530;color:#f9a8d4}
.av.xl{width:64px;height:64px;font-size:26px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);flex:none}
.ibtn:hover{color:var(--fg);background:var(--surface2)}
#saved{font-size:12.5px;color:var(--ok);font-weight:600;opacity:0;transition:opacity .3s;white-space:nowrap}
#saved.show{opacity:1}
#burger{display:none}
#content{flex:1;overflow:auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));scroll-behavior:smooth}
.page{max-width:1200px;margin:0 auto;animation:fadeup .25s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.ph h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hero{border:0;color:#fff;background:radial-gradient(600px 240px at 100% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(120deg,#4f46e5,#7c3aed 60%,#a855f7);
  --muted:rgba(255,255,255,.85);--accent:#fff;--fg:#fff;padding:22px 24px;margin-bottom:18px!important;box-shadow:0 10px 30px rgba(79,70,229,.25);position:relative;overflow:hidden}
.hero h2{font-size:22px!important;font-weight:700}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.stat{position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,var(--accent));opacity:.85}
.grid.g4>.stat:nth-child(4n+2){--sc:var(--ok)}.grid.g4>.stat:nth-child(4n+3){--sc:var(--gold)}.grid.g4>.stat:nth-child(4n+4){--sc:var(--blue)}
.stat .k{color:var(--muted);font-size:13px;font-weight:600}
.stat .v{font-size:30px;font-weight:700;line-height:1.35;letter-spacing:-.02em}
.stat .s{font-size:12.5px;color:var(--muted)}
.tw{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
th{background:var(--surface2);font-weight:700;color:var(--muted);font-size:12.5px;position:sticky;top:0;z-index:2}
tbody tr{transition:background .1s}
tbody tr:hover>td{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.lnk{color:inherit;font-weight:600;cursor:pointer;text-decoration:none;border-bottom:1px dashed transparent}
.lnk:hover{color:var(--accent);border-bottom-color:currentColor}
.cell{width:64px;text-align:center;padding:4px;min-height:34px;border-radius:8px;font-variant-numeric:tabular-nums;font-weight:600}
.cell.lo{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,transparent);color:var(--danger)}
.cell.hi{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);line-height:1.7}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--gold-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.bar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.empty{padding:32px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:var(--surface2);padding:4px;border-radius:12px;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:9px;padding:5px 14px;font-weight:600;color:var(--muted);font-size:14px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.quick button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);font-weight:600;text-align:left;box-shadow:var(--shadow);transition:.15s}
.quick button:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 15%,transparent)}
.quick .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.quick button:nth-child(6n+2) .ic{background:var(--ok-soft);color:var(--ok)}.quick button:nth-child(6n+3) .ic{background:var(--gold-soft);color:var(--warn)}
.quick button:nth-child(6n+4) .ic{background:var(--danger-soft);color:var(--danger)}.quick button:nth-child(6n+5) .ic{background:var(--blue-soft);color:var(--blue)}
.quick small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.4}
.rank{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-weight:700;font-size:13px;flex:none}
.rank:nth-child(1) .n{background:#fde68a;color:#92400e}.rank:nth-child(2) .n{background:#e2e8f0;color:#334155}.rank:nth-child(3) .n{background:#fed7aa;color:#9a3412}
.rank .nm{flex:1;min-width:0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal>div{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:92%;overflow:auto;padding:22px;border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
.modal>div.wide{max-width:680px}
.modal h3{font-size:18px;margin-bottom:6px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow-lg);animation:pop .2s}
textarea.in{min-height:160px;font-family:ui-monospace,monospace;font-size:12px}
.doc{background:var(--surface2);border:1px dashed var(--line2);border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.9;font-family:var(--f-doc)}
.scrim{display:none}
.sec{font-weight:700;font-size:13px;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
/* attendance segmented control */
.att3{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}

/* weighted average of a student for a column key (month index "m0".. or "s1"/"s2") */
function avgOf(sid,col){
  let sum=0,w=0;
  for(const sub of DB.subjects){
    const v=DB.scores[sid]?.[sub.id]?.[col];
    if(v!==undefined&&v!==''&&v!==null){sum+=Number(v)*sub.coef;w+=sub.coef}
  }
  return w?sum/w:null;
}
function yearAvg(sid){
  const cols=[...MONTHS.map((_,i)=>'m'+i),'s1','s2'];

  back:'<path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>',

Object.assign(ICP,{sdocs:ICP.splan,sdash:ICP.dash,mdash:ICP.dash,ssheet:ICP.scores,mscores:ICP.scores,matt:ICP.att,asetup:ICP.setup});
const ic=(k,sz)=>`<svg class="ico" ${sz?`style="width:${sz}px;height:${sz}px"`:''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICP[k]||ICP.more}</svg>`;
function hydrateIcons(root=document){root.querySelectorAll('i[data-ic]').forEach(i=>{i.outerHTML=ic(i.dataset.ic,i.dataset.sz)})}
const avatar=(s,cls='')=>`<span class="av ${s?.sex==='ស្រី'?'f':''} ${cls}">${esc((s?.name||'?').trim().split(/\s+/).pop().slice(0,1)||'?')}</span>`;
</script>
<script>
/* ---------- views A: dashboard, people, health ---------- */
const V={};
function latestMonth(){
  for(let i=MONTHS.length-1;i>=0;i--) if(DB.students.some(s=>avgOf(s.id,'m'+i)!=null))return i;
  return -1;
}
function periodAvg(sid,mode){
  const lm=latestMonth();
  if(mode==='month')return lm<0?null:avgOf(sid,'m'+lm);
  if(mode==='quarter'){const v=[lm,lm-1,lm-2].filter(i=>i>=0).map(i=>avgOf(sid,'m'+i)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
  if(mode==='sem'){const a=avgOf(sid,'s1');if(a!=null)return a;const v=[0,1,2,3,4].map(i=>avgOf(sid,'m'+i)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
  return yearAvg(sid);
}
function attRate(){
  let p=0,t=0;
  for(const d of Object.values(DB.att))for(const v of Object.values(d)){t++;if(v==='P'||v==='L')p++}
  return t?p/t*100:null;
}
function absentCount(sid){let n=0;for(const d of Object.values(DB.att))if(d[sid]==='A')n++;return n}
function atRisk(){
  return DB.students.map(s=>{
    const a=yearAvg(s.id),ab=absentCount(s.id),why=[];
    if(a!=null&&a<5)why.push('ពិន្ទុទាប');
    if(ab>=3)why.push('អវត្តមាន '+kh(ab)+' ដង');
    return why.length?{s,a,why}:null}).filter(Boolean);
}
function khDate(){
  const d=new Date(),days=['អាទិត្យ','ច័ន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ','សៅរ៍'];
  const ms=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
  return `ថ្ងៃ${days[d.getDay()]} ទី${kh(d.getDate())} ខែ${ms[d.getMonth()]} ឆ្នាំ${kh(d.getFullYear())}`;
}

let sdocTab='work';
V.sdocs={title:'កិច្ចការ ផែនការសិស្ស និងកិច្ចព្រមព្រៀង',render(el){
  const w=ROLE==='teacher'||(ROLE==='admin'&&VIEWCLASS)?'&w=class:'+encodeURIComponent(CUR.name):ROLE==='subject'&&SUBJT?'&w=subject:'+encodeURIComponent(SUBJT.name):'';
  const url=()=>'ឯកសារស្តង់ដា.html#embed='+sdocTab+w;
  el.innerHTML=`<div class="page" style="max-width:none"><div class="tabs" id="sdt">${[['work','កិច្ចការ'],['student','ផែនការសិស្ស'],['agreement','កិច្ចព្រមព្រៀង']].map(t=>`<button data-k="${t[0]}" class="${t[0]===sdocTab?'on':''}">${t[1]}</button>`).join('')}</div>
  <iframe id="sdf" title="ឯកសារស្តង់ដា" src="${url()}" style="width:100%;height:max(480px,calc(100vh - 170px));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)"></iframe></div>`;
  $('#sdt').onclick=e=>{const b=e.target.closest('button');if(!b)return;sdocTab=b.dataset.k;[...$('#sdt').children].forEach(x=>x.classList.toggle('on',x===b));$('#sdf').src=url()};
}};
V.dash={title:'ផ្ទាំងគ្រប់គ្រង',render(el){
  const st=DB.students,boys=st.filter(s=>s.sex==='ប្រុស').length,girls=st.length-boys;
  const lm=latestMonth(),mavg=lm<0?null:monthlyClassAvg(lm),ar=attRate(),risk=atRisk();
  const dist={A:0,B:0,C:0,D:0,E:0,F:0};
  st.forEach(s=>{const a=periodAvg(s.id,'year');const g=grade(a);if(g)dist[g[1]]++});
  const ages={};st.forEach(s=>{const a=ageOf(s);if(a!=null)ages[a]=(ages[a]||0)+1});
  const ageKeys=Object.keys(ages).sort((a,b)=>a-b);
  const maxAge=Math.max(1,...Object.values(ages));
  el.innerHTML=`<div class="page">
  <div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface))">
    <h2 style="font-size:18px">សួស្តី ${esc(DB.settings.teacher)} 👋</h2>
    <div style="color:var(--muted)">${esc(DB.settings.school)} · ${esc(DB.settings.className)} · ឆ្នាំសិក្សា ${esc(DB.settings.year)}</div>
    <div style="margin-top:6px;font-weight:600;color:var(--accent)">${khDate()}</div>
  </div>
  <div class="grid g4">
    <div class="card stat"><div class="k">សិស្សសរុប</div><div class="v num">${kh(st.length)}</div><div class="s">ប្រុស ${kh(boys)} · ស្រី ${kh(girls)}</div></div>
    <div class="card stat"><div class="k">មុខវិជ្ជា</div><div class="v num">${kh(DB.subjects.length)}</div><div class="s">មេគុណសរុប ${kh(DB.subjects.reduce((a,s)=>a+s.coef,0))}</div></div>
    <div class="card stat"><div class="k">មធ្យមភាគថ្នាក់ ${lm>=0?'ខែ'+MONTHS[lm]:''}</div><div class="v num">${mavg==null?'—':fx(mavg)}</div><div class="s">${mavg==null?'សូមបញ្ចូលពិន្ទុ':grade(mavg)[2]}</div></div>
    <div class="card stat"><div class="k">អត្រាចូលរៀន</div><div class="v num">${ar==null?'—':fx(ar,1)+'%'}</div><div class="s">${ar==null?'មិនទាន់មានទិន្នន័យ':'ពីការកត់ត្រាទាំងអស់'}</div></div>
  </div>
  <div class="sec">ការចូលប្រើប្រាស់រហ័ស</div>
  <div class="quick">
    ${[['scores','បញ្ចូលពិន្ទុ','ខែ ឆមាស'],['att','កត់ត្រាវត្តមាន','ថ្ងៃនេះ'],['results','លទ្ធផលប្រឡង','ចំណាត់ថ្នាក់'],['health','សុខភាពសិក្សា','BMI'],['reports','របាយការណ៍','និងផែនការ'],['people','បញ្ជីសិស្ស',kh(st.length)+' នាក់']].map(q=>`<button data-go="${q[0]}"><span class="ic">${ic(q[0])}</span><span>${q[1]}<small>${q[2]}</small></span></button>`).join('')}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>មធ្យមភាគប្រចាំខែ</h3>${barChart(MONTHS,MONTHS.map((_,i)=>monthlyClassAvg(i)))}</div>
    <div class="card"><h3>ការបែងចែកនិទ្ទេស (មធ្យមភាគឆ្នាំ)</h3>${donut(Object.entries(dist).map(([k,v])=>({label:k+' · '+GR.find(g=>g[1]===k)[2],value:v,color:GCOL[k]})))}</div>
    <div class="card"><h3>🏆 សិស្សពូកែកំពូល ១០នាក់</h3>
      <div class="tabs" id="t10">${[['month','ប្រចាំខែ'],['quarter','ត្រីមាស'],['sem','ឆមាស'],['year','ប្រចាំឆ្នាំ']].map((t,i)=>`<button data-m="${t[0]}" class="${i?'':'on'}">${t[1]}</button>`).join('')}</div>
      <div id="top10"></div></div>
    <div class="card"><h3>🚨 សិស្សប្រឈមហានិភ័យបោះបង់ការសិក្សា</h3>
      ${risk.length?risk.map(r=>`<div class="rank"><div class="nm"><b>${esc(r.s.name)}</b><div style="font-size:13px;color:var(--muted)">${r.why.join(' · ')}</div></div><span class="pill bad">${r.a==null?'—':fx(r.a)}</span></div>`).join(''):'<div class="empty">មិនមានសិស្សប្រឈមហានិភ័យទេ</div>'}
    </div>
    <div class="card"><h3>ការវិភាគអាយុ និងភេទ</h3>
      ${ageKeys.length?ageKeys.map(a=>`<div class="row" style="flex-wrap:nowrap;margin:4px 0"><span style="width:64px">${kh(a)} ឆ្នាំ</span><div class="bar" style="flex:1"><i style="width:${ages[a]/maxAge*100}%"></i></div><b class="num" style="width:28px;text-align:right">${kh(ages[a])}</b></div>`).join(''):'<div class="empty">មិនទាន់មានអាយុសិស្ស</div>'}
      <div style="margin-top:10px">${donut([{label:'ប្រុស',value:boys,color:'#2b6cb0'},{label:'ស្រី',value:girls,color:'#d6568a'}])}</div></div>
    <div class="card"><h3>📣 សេចក្តីប្រកាសថ្មីៗ</h3>
      ${DB.notices.slice(0,3).map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(n.title)}</b><div style="font-size:13px;color:var(--muted)">${esc(n.date)}</div></div>`).join('')||'<div class="empty">មិនទាន់មានសេចក្តីប្រកាស</div>'}
    </div>
  </div></div>`;
  const draw=m=>{
    const rows=st.map(s=>({s,a:periodAvg(s.id,m)})).filter(r=>r.a!=null).sort((a,b)=>b.a-a.a).slice(0,10);
    $('#top10').innerHTML=rows.length?rows.map((r,i)=>`<div class="rank"><div class="n">${kh(i+1)}</div><div class="nm"><a class="lnk" data-prof="${r.s.id}">${esc(r.s.name)}</a></div>${gpill(r.a)}<b class="num" style="width:44px;text-align:right">${fx(r.a)}</b></div>`).join(''):'<div class="empty">មិនទាន់មានពិន្ទុ</div>';
  };
  draw('month');
  $('#t10').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('#t10').children].forEach(x=>x.classList.toggle('on',x===b));draw(b.dataset.m)};
  el.onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
}};

/* people */
let peopleTab='st',peopleQ='',peopleSort='name';
V.people={title:'ព័ត៌មានគ្រូ និងសិស្ស',render(el){
  const draw=()=>{
    const q=(peopleQ||'').trim().toLowerCase();
    let rows=DB.students.filter(s=>!q||[s.name,s.guardian,s.phone,s.note].join(' ').toLowerCase().includes(q));
    rows.sort((a,b)=>peopleSort==='avg'?(yearAvg(b.id)??-1)-(yearAvg(a.id)??-1):a.name.localeCompare(b.name,'km'));
    el.innerHTML=`<div class="page"><div class="ph"><h2>ព័ត៌មានសិស្ស · ${esc(DB.settings.className)}</h2><div class="row">
      ${ROLE==='admin'?`<button class="btn sm pri" id="add">＋ បន្ថែម${peopleTab==='st'?'សិស្ស':'គ្រូ'}</button>`:'<span class="pill blue">ទិន្នន័យសិស្សបញ្ចូលដោយគណៈគ្រប់គ្រង</span>'}</div></div>
            ${peopleTab==='st'?`<div class="row" style="margin-bottom:10px"><input class="in" id="pq" style="max-width:280px" placeholder="ស្វែងរក / តម្រង" value="${esc(peopleQ)}"><select class="in" id="ps" style="max-width:200px"><option value="name">តម្រៀបតាមឈ្មោះ</option><option value="avg" ${peopleSort==='avg'?'selected':''}>តម្រៀបតាមមធ្យមភាគ</option></select></div>
      <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th><th class="c">ភេទ</th><th class="c">អាយុ</th><th>អាណាព្យាបាល</th><th>ទូរស័ព្ទ</th><th class="c">មធ្យមភាគ</th><th></th></tr></thead><tbody>
      ${rows.map((s,i)=>`<tr><td class="c num">${kh(i+1)}</td><td><div class="row" style="flex-wrap:nowrap;gap:10px">${avatar(s)}<span><a class="lnk" data-prof="${s.id}">${esc(s.name)}</a>${s.note?`<div style="font-size:12px;color:var(--muted);line-height:1.3">${esc(s.note)}</div>`:''}</span></div></td><td class="c">${esc(s.sex)}</td><td class="c num">${ageOf(s)==null?'—':kh(ageOf(s))}</td><td>${esc(s.guardian||'—')}</td><td>${esc(s.phone||'—')}</td><td class="c num">${fx(yearAvg(s.id))}</td><td>${ROLE==='admin'?`<button class="btn sm" data-e="${s.id}">កែ</button> <button class="btn sm dng" data-d="${s.id}">លុប</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">មិនមានសិស្ស</td></tr>'}
      </tbody></table></div>`:`<div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>ឈ្មោះគ្រូ</th><th>មុខវិជ្ជាបង្រៀន</th><th>ទូរស័ព្ទ</th><th></th></tr></thead><tbody>
      ${DB.teachers.map((t,i)=>`<tr><td class="c num">${kh(i+1)}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.subject||'—')}</td><td>${esc(t.phone||'—')}</td><td><button class="btn sm" data-te="${t.id}">កែ</button> <button class="btn sm dng" data-td="${t.id}">លុប</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">មិនទាន់មានគ្រូ</td></tr>'}
      </tbody></table></div>`}</div>`;
    const pq=$('#pq');if(pq){pq.oninput=()=>{peopleQ=pq.value;const p=pq.selectionStart;draw();const n=$('#pq');n.focus();n.setSelectionRange(p,p)}}
    const ps=$('#ps');if(ps)ps.onchange=()=>{peopleSort=ps.value;draw()};
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{peopleTab=b.dataset.t;draw()});
    const ab=$('#add');if(ab)ab.onclick=()=>peopleTab==='st'?studentForm():teacherForm();
    el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>studentForm(b.dataset.e));
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>ask('លុបសិស្សនេះ និងពិន្ទុរបស់គាត់?',()=>{const id=b.dataset.d;DB.students=DB.students.filter(s=>s.id!==id);delete DB.scores[id];Object.values(DB.att).forEach(d=>delete d[id]);save();draw()}));
    el.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>teacherForm(b.dataset.te));
    el.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>ask('លុបគ្រូនេះ?',()=>{DB.teachers=DB.teachers.filter(t=>t.id!==b.dataset.td);save();draw()}));
  };
  AFTER=draw;V.people.redraw=draw;draw();
}};
function studentForm(id){
  const s=id?DB.students.find(x=>x.id===id):{name:'',sex:'ប្រុស',dob:'',guardian:'',phone:''};
  modal(`<h3>${id?'កែព័ត៌មានសិស្ស':'បន្ថែមសិស្ស'}</h3>
  <label class="f" for="fn">គោត្តនាម និងនាម</label><input class="in" id="fn" value="${esc(s.name)}">
  <label class="f" for="fs">ភេទ</label><select class="in" id="fs"><option ${s.sex==='ប្រុស'?'selected':''}>ប្រុស</option><option ${s.sex==='ស្រី'?'selected':''}>ស្រី</option></select>
  <label class="f" for="fd">ថ្ងៃខែឆ្នាំកំណើត</label><input class="in" type="date" id="fd" value="${esc(s.dob)}">
  <label class="f" for="fg">អាណាព្យាបាល</label><input class="in" id="fg" value="${esc(s.guardian)}">
  <label class="f" for="fp">ទូរស័ព្ទ</label><input class="in" id="fp" value="${esc(s.phone)}">
  <label class="f" for="fps">លេខសម្ងាត់សិស្ស (ទទេ = ៤ខ្ទង់ចុងនៃទូរស័ព្ទ)</label><input class="in" id="fps" value="${esc(s.pinS||'')}">
  <label class="f" for="fpg">លេខសម្ងាត់អាណាព្យាបាល (ទទេ = ៦ខ្ទង់ចុងនៃទូរស័ព្ទ)</label><input class="in" id="fpg" value="${esc(s.pinG||'')}">
  ${id?`<div class="hint" style="text-align:left">ប្រើបច្ចុប្បន្ន — សិស្ស៖ <b>${esc(pinOf(s,'S'))}</b> · អាណាព្យាបាល៖ <b>${esc(pinOf(s,'G'))}</b></div>`:''}
  <div class="err" id="fe"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-x>បោះបង់</button><button class="btn pri" data-ok>រក្សាទុក</button></div>`,m=>{
    m.querySelector('[data-x]').onclick=()=>m.remove();
    m.querySelector('[data-ok]').onclick=()=>{
      const name=$('#fn',m).value.trim();if(!name){$('#fe',m).textContent='សូមបញ្ចូលឈ្មោះ';return}
      const o={name,sex:$('#fs',m).value,dob:$('#fd',m).value,guardian:$('#fg',m).value.trim(),phone:$('#fp',m).value.trim(),pinS:$('#fps',m).value.trim(),pinG:$('#fpg',m).value.trim()};
      if(id)Object.assign(s,o);else DB.students.push({id:uid(),...o});
      save();m.remove();AFTER&&AFTER();toast('បានរក្សាទុក')};
  });
}
function teacherForm(id){
  const t=id?DB.teachers.find(x=>x.id===id):{name:'',subject:'',phone:''};
  modal(`<h3>${id?'កែព័ត៌មានគ្រូ':'បន្ថែមគ្រូ'}</h3>
  <label class="f" for="tn">ឈ្មោះ</label><input class="in" id="tn" value="${esc(t.name)}">
  <label class="f" for="ts">មុខវិជ្ជាបង្រៀន</label><input class="in" id="ts" value="${esc(t.subject)}">
  <label class="f" for="tp">ទូរស័ព្ទ</label><input class="in" id="tp" value="${esc(t.phone)}">
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-x>បោះបង់</button><button class="btn pri" data-ok>រក្សាទុក</button></div>`,m=>{
    m.querySelector('[data-x]').onclick=()=>m.remove();
    m.querySelector('[data-ok]').onclick=()=>{
      const name=$('#tn',m).value.trim();if(!name)return;

      if(id)Object.assign(t,o);else DB.teachers.push({id:uid(),...o});
      save();m.remove();(window.teacherDone||(()=>{}))();toast('បានរក្សាទុក')};
  });
}

/* health */
V.health={title:'សុខភាពសិក្សាសិស្ស',render(el){
  const rows=DB.students,cnt={};
  rows.forEach(s=>{const k=bmiState(bmi(s))[0];cnt[k]=(cnt[k]||0)+1});
  el.innerHTML=`<div class="page"><div class="ph"><h2>💚 សុខភាពសិក្សាសិស្ស</h2><span class="pill blue">BMI = ទម្ងន់ ÷ កម្ពស់²</span></div>
  <div class="grid g4" style="margin-bottom:14px">${['ស្គម','ធម្មតា','លើសទម្ងន់','ធាត់'].map(k=>`<div class="card stat"><div class="k">${k}</div><div class="v num">${kh(cnt[k]||0)}</div></div>`).join('')}</div>
  <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th><th class="c">ភេទ</th><th class="c">ទម្ងន់ (kg)</th><th class="c">កម្ពស់ (cm)</th><th class="c">BMI</th><th class="c">លទ្ធផល</th></tr></thead><tbody>
  ${rows.map((s,i)=>{const b=bmi(s),st=bmiState(b);return `<tr data-id="${s.id}"><td class="c num">${kh(i+1)}</td><td>${esc(s.name)}</td><td class="c">${esc(s.sex)}</td>
  <td class="c"><input class="in cell" inputmode="decimal" data-f="w" value="${s.w??''}" aria-label="ទម្ងន់"></td>
  <td class="c"><input class="in cell" inputmode="decimal" data-f="h" value="${s.h??''}" aria-label="កម្ពស់"></td>
  <td class="c num" data-b>${b==null?'—':fx(b,1)}</td><td class="c" data-s><span class="pill ${st[1]}">${st[0]}</span></td></tr>`}).join('')}
  </tbody></table></div></div>`;
  el.querySelectorAll('input[data-f]').forEach(inp=>inp.onchange=()=>{
    const tr=inp.closest('tr'),s=DB.students.find(x=>x.id===tr.dataset.id),v=parseFloat(inp.value);
    s[inp.dataset.f]=isNaN(v)?null:v;save();
    const b=bmi(s),st=bmiState(b);
    tr.querySelector('[data-b]').textContent=b==null?'—':fx(b,1);
    tr.querySelector('[data-s]').innerHTML=`<span class="pill ${st[1]}">${st[0]}</span>`;
  });
}};
</script>
<script>
/* ---------- views B: subjects, scores, results, attendance ---------- */
V.subjects={title:'គ្រប់គ្រងមេគុណមុខវិជ្ជា',render(el){
  const draw=()=>{
    el.innerHTML=`<div class="page"><div class="ph"><h2>📘 គ្រប់គ្រងពិន្ទុមេគុណតាមមុខវិជ្ជា</h2><button class="btn pri sm" id="addSub">＋ បន្ថែមមុខវិជ្ជា</button></div>
    <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>មុខវិជ្ជា</th><th class="c">មេគុណ</th><th class="c">មធ្យមភាគថ្នាក់ (ខែចុងក្រោយ)</th><th></th></tr></thead><tbody>
    ${DB.subjects.map((s,i)=>{const lm=latestMonth();const v=DB.students.map(x=>DB.scores[x.id]?.[s.id]?.['m'+lm]).filter(x=>x!==undefined&&x!=='');const a=v.length?v.reduce((p,c)=>p+Number(c),0)/v.length:null;
      return `<tr><td class="c num">${kh(i+1)}</td><td><input class="in" style="min-width:160px" data-n="${s.id}" value="${esc(s.name)}" aria-label="ឈ្មោះមុខវិជ្ជា"></td><td class="c"><input class="in cell" inputmode="numeric" data-c="${s.id}" value="${s.coef}" aria-label="មេគុណ"></td><td class="c num">${fx(a)}</td><td><button class="btn sm dng" data-x="${s.id}">លុប</button></td></tr>`}).join('')}
    </tbody></table></div>
    <p style="color:var(--muted);font-size:13px">មធ្យមភាគ = ផលបូក(ពិន្ទុ × មេគុណ) ÷ ផលបូកមេគុណ។ ពិន្ទុគិតលើ ១០។</p></div>`;
    el.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>{DB.subjects.find(s=>s.id===i.dataset.n).name=i.value.trim()||'—';save()});
    el.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{const v=Math.max(1,parseInt(i.value)||1);DB.subjects.find(s=>s.id===i.dataset.c).coef=v;i.value=v;save()});
    el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ask('លុបមុខវិជ្ជានេះ និងពិន្ទុទាំងអស់របស់វា?',()=>{const id=b.dataset.x;DB.subjects=DB.subjects.filter(s=>s.id!==id);Object.values(DB.scores).forEach(o=>delete o[id]);save();draw()}));
    $('#addSub').onclick=()=>{DB.subjects.push({id:uid(),name:'មុខវិជ្ជាថ្មី',coef:1});save();draw()};
  };draw();
}};

const COLS=[...MONTHS.map((m,i)=>({k:'m'+i,n:'ខែ'+m})),{k:'s1',n:'ឆមាសទី១'},{k:'s2',n:'ឆមាសទី២'}];
let scoreCol='m0';
V.scores={title:'សម្រង់ពិន្ទុ',render(el){
  if(scoreCol==='m0'&&latestMonth()>=0)scoreCol='m'+latestMonth();
  const draw=()=>{
    el.innerHTML=`<div class="page"><div class="ph"><h2>📝 សម្រង់ពិន្ទុនៃការប្រឡងនានា</h2>
      <div class="row"><span class="pill blue" id="fillc"></span><select class="in" id="colSel" style="max-width:200px" aria-label="ជ្រើសរើសខែ/ឆមាស">${COLS.map(c=>`<option value="${c.k}" ${c.k===scoreCol?'selected':''}>${c.n}</option>`).join('')}</select></div></div>
      <div class="bar" style="margin:-6px 0 14px"><i id="fillb" style="width:0"></i></div>
    <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th>${DB.subjects.map(s=>`<th class="c">${esc(s.name)}<br><small>×${kh(s.coef)}</small></th>`).join('')}<th class="c">មធ្យមភាគ</th><th>និទ្ទេស</th></tr></thead><tbody>
    ${DB.students.map((s,i)=>`<tr data-id="${s.id}"><td class="c num">${kh(i+1)}</td><td>${esc(s.name)}</td>
      ${DB.subjects.map(b=>`<td class="c"><input class="in cell" inputmode="decimal" data-sub="${b.id}" value="${DB.scores[s.id]?.[b.id]?.[scoreCol]??''}" aria-label="${esc(b.name)}"></td>`).join('')}
      <td class="c num" data-a><b>${fx(avgOf(s.id,scoreCol))}</b></td><td data-g>${gpill(avgOf(s.id,scoreCol))}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">សូមបន្ថែមសិស្សជាមុន</td></tr>'}
    </tbody></table></div><p style="color:var(--muted);font-size:13px">ពិន្ទុ ០ ដល់ ១០ · រក្សាទុកដោយស្វ័យប្រវត្តិ · ចុច Enter ឬ ↓ ដើម្បីទៅសិស្សបន្ទាប់ · ពិន្ទុក្រោម ៥ ពណ៌ក្រហម ≥ ៨ ពណ៌បៃតង។</p></div>`;
    const fill=()=>{const all=[...el.querySelectorAll('input[data-sub]')],n=all.filter(i=>i.value!=='').length;$('#fillc').textContent=`បានបញ្ចូល ${kh(n)} / ${kh(all.length)}`;$('#fillb').style.width=(all.length?n/all.length*100:0)+'%'};fill();
    el.querySelector('.tw').addEventListener('change',e=>{if(e.target.matches('input[data-sub]'))fill()});
    $('#colSel').onchange=e=>{scoreCol=e.target.value;draw()};
    el.querySelectorAll('input[data-sub]').forEach(inp=>inp.onchange=()=>{
      const tr=inp.closest('tr'),sid=tr.dataset.id,sub=inp.dataset.sub;
      let v=inp.value.trim().replace(',','.');
      if(v===''){if(DB.scores[sid]?.[sub])delete DB.scores[sid][sub][scoreCol]}
      else{let n=parseFloat(v);if(isNaN(n)){inp.value='';return}n=Math.min(10,Math.max(0,n));inp.value=n;
        ((DB.scores[sid]??={})[sub]??={})[scoreCol]=n}
      save();const a=avgOf(sid,scoreCol);
      tr.querySelector('[data-a]').innerHTML='<b>'+fx(a)+'</b>';tr.querySelector('[data-g]').innerHTML=gpill(a);
    });
  };draw();
}};

let resMode='m',resCol='m0';
V.results={title:'លទ្ធផលនៃការប្រឡង',render(el){
  if(resMode==='m'&&resCol==='m0'&&latestMonth()>=0)resCol='m'+latestMonth();
  const draw=()=>{
    const getA=s=>resMode==='y'?yearAvg(s.id):avgOf(s.id,resCol);
    const rows=DB.students.map(s=>({s,a:getA(s)})).sort((x,y)=>(y.a??-1)-(x.a??-1));
    let rk=0,last=null,pos=0;rows.forEach(r=>{pos++;if(r.a!==last){rk=pos;last=r.a}r.rank=r.a==null?null:rk});
    const have=rows.filter(r=>r.a!=null),pass=have.filter(r=>r.a>=5).length;
    el.innerHTML=`<div class="page"><div class="ph"><h2>🏁 លទ្ធផលនៃការប្រឡង</h2></div>
    <div class="tabs"><button data-m="m" class="${resMode==='m'?'on':''}">ប្រចាំខែ</button><button data-m="s" class="${resMode==='s'?'on':''}">ឆមាស</button><button data-m="y" class="${resMode==='y'?'on':''}">ប្រចាំឆ្នាំ</button></div>
    ${resMode!=='y'?`<select class="in" id="rc" style="max-width:220px;margin-bottom:12px" aria-label="រយៈពេល">${(resMode==='m'?COLS.slice(0,MONTHS.length):COLS.slice(MONTHS.length)).map(c=>`<option value="${c.k}" ${c.k===resCol?'selected':''}>${c.n}</option>`).join('')}</select>`:''}
    <div class="grid g4" style="margin-bottom:14px">
      <div class="card stat"><div class="k">មានពិន្ទុ</div><div class="v num">${kh(have.length)}</div></div>
      <div class="card stat"><div class="k">ជាប់ (≥ ៥)</div><div class="v num">${kh(pass)}</div><div class="s">${have.length?fx(pass/have.length*100,0)+'%':''}</div></div>
      <div class="card stat"><div class="k">ធ្លាក់</div><div class="v num" style="color:var(--danger)">${kh(have.length-pass)}</div></div>
      <div class="card stat"><div class="k">មធ្យមភាគថ្នាក់</div><div class="v num">${have.length?fx(have.reduce((p,c)=>p+c.a,0)/have.length):'—'}</div></div></div>
    <div class="tw"><table><thead><tr><th class="c">ចំណាត់ថ្នាក់</th><th>គោត្តនាម និងនាម</th><th class="c">ភេទ</th><th class="c">មធ្យមភាគ</th><th>និទ្ទេស</th><th>លទ្ធផល</th><th>កិត្តិយស</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="c num">${r.rank?kh(r.rank):'—'}</td><td><a class="lnk" data-prof="${r.s.id}">${esc(r.s.name)}</a></td><td class="c">${esc(r.s.sex)}</td><td class="c num"><b>${fx(r.a)}</b></td><td>${gpill(r.a)}</td>
      <td>${r.a==null?'—':r.a>=5?'<span class="pill ok">ជាប់</span>':'<span class="pill bad">ធ្លាក់</span>'}</td><td>${r.a>=9?'🥇 ល្អប្រសើរ':r.a>=8?'🏅 ល្អណាស់':''}</td></tr>`).join('')}
    </tbody></table></div></div>`;
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{resMode=b.dataset.m;resCol=resMode==='s'?'s1':'m'+Math.max(0,latestMonth());draw()});
    const rc=$('#rc');if(rc)rc.onchange=()=>{resCol=rc.value;draw()};
  };draw();
}};

let attDate=todayStr(),attTab='day';
V.att={title:'វត្តមានសិស្ស',render(el){
  const NEXT={P:'A',A:'L',L:'P'},LAB={P:['មក','ok'],A:['អវត្តមាន','bad'],L:['ច្បាប់','warn']};
  const draw=()=>{
    if(attTab==='day'){
      const d=DB.att[attDate]||{};
      el.innerHTML=`<div class="page"><div class="ph"><h2>🗓 វត្តមានសិស្ស</h2></div>
      <div class="tabs"><button data-t="day" class="on">ប្រចាំថ្ងៃ</button><button data-t="sum">សង្ខេប</button></div>
      <div class="row" style="margin-bottom:12px"><button class="ibtn" id="adPrev" aria-label="ថ្ងៃមុន">‹</button><input type="date" class="in" id="ad" style="max-width:190px" value="${attDate}"><button class="ibtn" id="adNext" aria-label="ថ្ងៃបន្ទាប់">›</button>
        ${attDate!==todayStr()?'<button class="btn sm" id="adToday">ថ្ងៃនេះ</button>':''}<span style="flex:1"></span><button class="btn sm pri" id="allP">✓ មកទាំងអស់</button><button class="btn sm" id="clrA">សម្អាត</button></div>
      <div class="attsum" id="asum"></div>
      <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th><th class="c">ស្ថានភាព</th></tr></thead><tbody>
      ${DB.students.map((s,i)=>{const v=d[s.id];return `<tr><td class="c num">${kh(i+1)}</td><td><div class="row" style="flex-wrap:nowrap;gap:10px">${avatar(s)}<a class="lnk" data-prof="${s.id}">${esc(s.name)}</a></div></td><td class="c"><div class="att3" role="group" aria-label="${esc(s.name)}" data-s="${s.id}">${['P','L','A'].map(k=>`<button data-v="${k}" class="${k}${v===k?' on':''}" aria-pressed="${v===k}">${LAB[k][0]}</button>`).join('')}</div></td></tr>`}).join('')}
      </tbody></table></div></div>`;
      const sum=()=>{const o=DB.att[attDate]||{},n={P:0,L:0,A:0};DB.students.forEach(s=>{if(o[s.id])n[o[s.id]]++});const un=DB.students.length-n.P-n.L-n.A;
        $('#asum').innerHTML=`<span><i style="background:var(--ok)"></i>មក ${kh(n.P)}</span><span><i style="background:var(--gold)"></i>ច្បាប់ ${kh(n.L)}</span><span><i style="background:var(--danger)"></i>អវត្តមាន ${kh(n.A)}</span><span><i style="background:var(--line2)"></i>មិនទាន់កត់ ${kh(un)}</span>`};sum();
      const shift=k=>{const d=new Date(attDate+'T00:00:00');d.setDate(d.getDate()+k);attDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');draw()};
      $('#adPrev').onclick=()=>shift(-1);$('#adNext').onclick=()=>shift(1);
      const at=$('#adToday');if(at)at.onclick=()=>{attDate=todayStr();draw()};
      $('#ad').onchange=e=>{attDate=e.target.value||todayStr();draw()};
      $('#allP').onclick=()=>{const o=(DB.att[attDate]??={});DB.students.forEach(s=>{if(!o[s.id])o[s.id]='P'});save();draw();toast('បានកត់ “មក” ដល់សិស្សដែលមិនទាន់កត់')};
      $('#clrA').onclick=()=>ask('សម្អាតវត្តមានថ្ងៃនេះ?',()=>{delete DB.att[attDate];save();draw()});
      el.querySelectorAll('.att3 button').forEach(b=>b.onclick=()=>{const g=b.parentElement,id=g.dataset.s,o=(DB.att[attDate]??={}),k=b.dataset.v;
        if(o[id]===k)delete o[id];else o[id]=k;if(!Object.keys(o).length)delete DB.att[attDate];save();
        g.querySelectorAll('button').forEach(x=>{const on=o[id]===x.dataset.v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});sum()});
    }else{
      const days=Object.keys(DB.att).sort();
      el.innerHTML=`<div class="page"><div class="ph"><h2>🗓 វត្តមានសិស្ស</h2></div>
      <div class="tabs"><button data-t="day">ប្រចាំថ្ងៃ</button><button data-t="sum" class="on">សង្ខេប</button></div>
      <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th><th class="c">មក</th><th class="c">ច្បាប់</th><th class="c">អវត្តមាន</th><th class="c">អត្រា</th></tr></thead><tbody>
      ${DB.students.map((s,i)=>{let p=0,l=0,a=0;days.forEach(k=>{const v=DB.att[k][s.id];if(v==='P')p++;else if(v==='L')l++;else if(v==='A')a++});const t=p+l+a;
        return `<tr><td class="c num">${kh(i+1)}</td><td>${esc(s.name)}</td><td class="c num">${kh(p)}</td><td class="c num">${kh(l)}</td><td class="c num">${a>=3?`<span class="pill bad">${kh(a)}</span>`:kh(a)}</td><td class="c num">${t?fx((p+l)/t*100,0)+'%':'—'}</td></tr>`}).join('')}
      </tbody></table></div><p style="color:var(--muted);font-size:13px">បានកត់ត្រា ${kh(days.length)} ថ្ងៃ។</p></div>`;
    }
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{attTab=b.dataset.t;draw()});
  };draw();
}};
</script>
<script>
/* ---------- views C: teacher work, reports, notices, tools, setup ---------- */
const DAYS=['ច័ន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ'];
let workTab='sec';
const COMM_ROLES=['ប្រធានថ្នាក់','អនុប្រធានទី១','អនុប្រធានទី២','លេខា','ប្រធានក្រុមទី១','ប្រធានក្រុមទី២','ប្រធានក្រុមទី៣','ប្រធានក្រុមទី៤','ប្រធានអនាម័យ','ប្រធានវិន័យ','ប្រធានសិក្សា'];
const COUNCIL_ROLES=['ប្រធានសាខា','អនុប្រធានសាខា','លេខាធិការ','ហិរញ្ញិក','ប្រធានផ្នែកសិក្សា','ប្រធានផ្នែកអនាម័យ-សុខភាព','ប្រធានផ្នែកកីឡា-សិល្បៈ'];
const SEC_F=[['start','សិស្សដើមឆ្នាំ'],['newIn','ចូលថ្មី'],['transIn','ផ្លាស់ចូល'],['transOut','ផ្លាស់ចេញ'],['drop','បោះបង់']];
V.work={title:'ការងារសម្រាប់គ្រូ',render(el){
  const W=DB.work;W.sec??={};W.inv??=[];W.comm??={};W.council??={};W.councilMembers??=[];
  const tabs=[['sec','🧮 SEC ចំនួនសិស្ស'],['clean','🧹 វេនសម្អាត'],['sheet','📋 បញ្ជីស្រង់ពិន្ទុ'],['sched','🗓 កាលវិភាគ'],['rules','📜 បទបញ្ជាផ្ទៃក្នុង'],['parents','📞 អាណាព្យាបាល'],['inv','📦 សារពើភ័ណ្ឌ'],['seat','🪑 ប្លង់តុ'],['comm','🏫 គ.គ.ថ'],['council','🧒 ក្រុមប្រឹក្សាកុមារ-យុវជន']];
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  let sheetSub=null;
  const stuSel=(attr,cur)=>`<select class="in" style="min-width:170px" ${attr}><option value="">— មិនទាន់កំណត់ —</option>${DB.students.map(s=>`<option value="${s.id}" ${s.id===cur?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
  const roleTable=(key,roles)=>`<div class="tw"><table><thead><tr><th>តួនាទី</th><th>សិស្ស</th></tr></thead><tbody>${roles.map((r,i)=>`<tr><td>${r}</td><td>${stuSel(`data-role="${key}|${i}" aria-label="${r}"`,W[key][i])}</td></tr>`).join('')}</tbody></table></div>`;
  const draw=()=>{
    let body='';const t=workTab;
    if(t==='sec'){
      const n=DB.students.length,g=DB.students.filter(s=>s.sex==='ស្រី').length,sc=W.sec;
      const exp=SEC_F.reduce((a,f,i)=>a+(i<3?1:-1)*(+sc[f[0]]||0),0);
      body=`<div class="grid g4" style="margin-bottom:12px"><div class="card stat"><div class="k">សិស្សបច្ចុប្បន្ន</div><div class="v num">${kh(n)}</div><div class="s">ស្រី ${kh(g)} · ប្រុស ${kh(n-g)}</div></div>
      <div class="card stat"><div class="k">តាមការគណនា</div><div class="v num">${kh(exp)}</div><div class="s">${exp===n?'ត្រូវគ្នា':'ខុសពីបញ្ជីឈ្មោះ '+kh(Math.abs(exp-n))}</div></div></div>
      <div class="tw"><table style="min-width:420px"><thead><tr><th>${esc(CUR.name)}</th><th class="c">ចំនួន</th></tr></thead><tbody>${SEC_F.map(f=>`<tr><td>${f[1]}</td><td class="c"><input class="in cell" inputmode="numeric" data-sec="${f[0]}" value="${sc[f[0]]??''}" aria-label="${f[1]}"></td></tr>`).join('')}
      <tr><td><b>សិស្សបច្ចុប្បន្ន (ស្វ័យប្រវត្តិ)</b></td><td class="c num"><b>${kh(n)}</b></td></tr></tbody></table></div>
      <p style="color:var(--muted);font-size:13px">សិស្សបច្ចុប្បន្ន = ដើមឆ្នាំ + ចូលថ្មី + ផ្លាស់ចូល − ផ្លាស់ចេញ − បោះបង់។ ឯកសារបោះពុម្ពនៅ “ទាញចេញ និងបោះពុម្ព”។</p>`;
    }else if(t==='clean'){
      const names=W.clean||{};
      body=`<div class="row" style="margin-bottom:10px"><button class="btn pri sm" id="gen">បែងចែកវេនសម្អាតថ្មី</button></div><div class="grid g2">${DAYS.map(d=>`<div class="card"><h3>ថ្ងៃ${d}</h3>${(names[d]||[]).map(n=>`<div>• ${esc(n)}</div>`).join('')||'<span style="color:var(--muted)">មិនទាន់បែងចែក</span>'}</div>`).join('')}</div>`;
    }else if(t==='sheet'){
      sheetSub=sheetSub||DB.subjects[0]?.id;
      body=`<div class="row" style="margin-bottom:10px"><select class="in" id="shs" style="max-width:240px" aria-label="មុខវិជ្ជា">${DB.subjects.map(b=>`<option value="${b.id}" ${b.id===sheetSub?'selected':''}>${esc(b.name)}</option>`).join('')}</select><span class="pill blue">បញ្ចូលនៅទីនេះក៏បាន</span></div>
      <div class="tw"><table style="min-width:900px"><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th>${COLS.map(c=>`<th class="c">${c.n.replace('ខែ','')}</th>`).join('')}<th class="c">មធ្យម</th></tr></thead><tbody>
      ${DB.students.map((s,i)=>{const o=DB.scores[s.id]?.[sheetSub]||{};const v=Object.values(o).map(Number);return `<tr data-id="${s.id}"><td class="c num">${kh(i+1)}</td><td>${esc(s.name)}</td>${COLS.map(c=>`<td class="c"><input class="in cell" style="width:54px" inputmode="decimal" data-c="${c.k}" value="${o[c.k]??''}" aria-label="${c.n}"></td>`).join('')}<td class="c num" data-av>${v.length?fx(mean(v)):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
    }else if(t==='sched'){
      const periods=['ម៉ោង ១','ម៉ោង ២','ម៉ោង ៣','ម៉ោង ៤','ម៉ោង ៥','ម៉ោង ៦'];
      body=`<div class="tw"><table><thead><tr><th></th>${DAYS.map(d=>`<th class="c">${d}</th>`).join('')}</tr></thead><tbody>${periods.map((p,r)=>`<tr><th>${p}</th>${DAYS.map((d,c)=>`<td><input class="in" style="min-width:110px" data-k="${r}-${c}" value="${esc(W.sched?.[r+'-'+c]||'')}" aria-label="${p} ${d}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }else if(t==='rules'){
      body=`<textarea class="in" id="rules" style="min-height:260px;font-family:var(--f-body);font-size:15px">${esc(W.rules||'')}</textarea>`;
    }else if(t==='parents'){
      body=`<div class="tw"><table><thead><tr><th>សិស្ស</th><th>អាណាព្យាបាល</th><th>ទូរស័ព្ទ</th></tr></thead><tbody>${DB.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.guardian||'—')}</td><td>${esc(s.phone||'—')}</td></tr>`).join('')}</tbody></table></div>`;
    }else if(t==='inv'){
      body=`<div class="row" style="margin-bottom:10px"><button class="btn pri sm" id="addInv">＋ បន្ថែមសម្ភារៈ</button></div><div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>ឈ្មោះសម្ភារៈ</th><th class="c">ចំនួន</th><th>ស្ថានភាព</th><th>កំណត់សម្គាល់</th><th></th></tr></thead><tbody>
      ${W.inv.map((x,i)=>`<tr><td class="c num">${kh(i+1)}</td><td><input class="in" style="min-width:150px" data-i="${x.id}|name" value="${esc(x.name)}" aria-label="ឈ្មោះ"></td><td class="c"><input class="in cell" inputmode="numeric" data-i="${x.id}|qty" value="${x.qty}" aria-label="ចំនួន"></td>
      <td><select class="in" data-i="${x.id}|state" aria-label="ស្ថានភាព">${['ល្អ','ប្រើបាន','ខូច'].map(o=>`<option ${o===x.state?'selected':''}>${o}</option>`).join('')}</select></td><td><input class="in" data-i="${x.id}|note" value="${esc(x.note||'')}" aria-label="កំណត់សម្គាល់"></td><td><button class="btn sm dng" data-di="${x.id}">លុប</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">មិនទាន់មានសម្ភារៈ ចុច “បន្ថែមសម្ភារៈ”</td></tr>'}</tbody></table></div>`;
    }else if(t==='seat'){
      const seats=W.seat||[];
      body=`<div class="row" style="margin-bottom:10px"><button class="btn pri sm" id="gen">រៀបតុថ្មីដោយចៃដន្យ</button><span class="pill blue">តុ ២នាក់ក្នុងមួយ</span></div>
      <div class="card" style="text-align:center;margin-bottom:10px;background:var(--surface2)">ក្តារខៀន</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))">${seats.map((p,i)=>`<div class="card" style="padding:10px"><small style="color:var(--muted)">តុទី ${kh(i+1)}</small><div>${esc(p[0]||'')}</div><div>${esc(p[1]||'')}</div></div>`).join('')||'<div class="empty">ចុចប៊ូតុងដើម្បីរៀបតុ</div>'}</div>`;
    }else if(t==='comm'){
      body=`<p style="color:var(--muted);margin-top:0">គណៈគ្រប់គ្រងថ្នាក់ (គ.គ.ថ) ជ្រើសរើសពីសិស្សក្នុងថ្នាក់។</p>`+roleTable('comm',COMM_ROLES);
    }else{
      body=`<p style="color:var(--muted);margin-top:0">សាខាក្រុមប្រឹក្សាកុមារ-យុវជន ក្នុង${esc(CUR.name)}</p>`+roleTable('council',COUNCIL_ROLES)+
      `<div class="sec">សមាជិក</div><div class="row" style="margin-bottom:8px">${stuSel('id="addMem" aria-label="បន្ថែមសមាជិក"','')}<button class="btn sm pri" id="addMemB">＋ បន្ថែម</button></div>
      <div class="row">${W.councilMembers.map(id=>{const s=DB.students.find(x=>x.id===id);return s?`<span class="pill blue">${esc(s.name)} <a data-rm="${id}" style="cursor:pointer" role="button" tabindex="0" aria-label="ដកចេញ">✕</a></span>`:''}).join('')||'<span style="color:var(--muted)">មិនទាន់មានសមាជិក</span>'}</div>`;
    }
    el.innerHTML=`<div class="page"><div class="ph"><h2>🧰 ការងារសម្រាប់គ្រូ</h2></div><div class="tabs">${tabs.map(x=>`<button data-t="${x[0]}" class="${x[0]===t?'on':''}">${x[1]}</button>`).join('')}</div>${body}</div>`;
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{workTab=b.dataset.t;draw()});
    const g=$('#gen');
    if(g)g.onclick=()=>{
      const names=shuffle(DB.students.map(s=>s.name));
      if(workTab==='clean'){const o={};DAYS.forEach(d=>o[d]=[]);names.forEach((n,i)=>o[DAYS[i%5]].push(n));W.clean=o}
      else{const s=[];for(let i=0;i<names.length;i+=2)s.push([names[i],names[i+1]]);W.seat=s}
      save();draw();
    };
    el.querySelectorAll('input[data-sec]').forEach(i=>i.onchange=()=>{W.sec[i.dataset.sec]=Math.max(0,parseInt(i.value)||0);save();draw()});
    const shs=$('#shs');if(shs)shs.onchange=()=>{sheetSub=shs.value;draw()};
    if(workTab==='sheet')el.querySelectorAll('tr[data-id] input').forEach(inp=>inp.onchange=()=>{
      const tr=inp.closest('tr'),sid=tr.dataset.id,sub=$('#shs').value,v=inp.value.trim().replace(',','.');
      if(v===''){if(DB.scores[sid]?.[sub])delete DB.scores[sid][sub][inp.dataset.c]}
      else{let n=parseFloat(v);if(isNaN(n)){inp.value='';return}n=Math.min(10,Math.max(0,n));inp.value=n;((DB.scores[sid]??={})[sub]??={})[inp.dataset.c]=n}
      save();const vals=Object.values(DB.scores[sid]?.[sub]||{}).map(Number);tr.querySelector('[data-av]').textContent=vals.length?fx(mean(vals)):'—'});
    el.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{(W.sched??={})[i.dataset.k]=i.value;save()});
    const r=$('#rules');if(r)r.onchange=()=>{W.rules=r.value;save();toast('បានរក្សាទុក')};
    const ai=$('#addInv');if(ai)ai.onclick=()=>{W.inv.push({id:uid(),name:'សម្ភារៈថ្មី',qty:1,state:'ល្អ',note:''});save();draw()};
    el.querySelectorAll('[data-i]').forEach(i=>i.onchange=()=>{const [id,f]=i.dataset.i.split('|'),x=W.inv.find(y=>y.id===id);x[f]=f==='qty'?Math.max(0,parseInt(i.value)||0):i.value;save()});
    el.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{W.inv=W.inv.filter(x=>x.id!==b.dataset.di);save();draw()});
    el.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>{const [k,i]=s.dataset.role.split('|');W[k][i]=s.value;save()});
    const am=$('#addMemB');if(am)am.onclick=()=>{const v=$('#addMem').value;if(v&&!W.councilMembers.includes(v)){W.councilMembers.push(v);save();draw()}};
    el.querySelectorAll('[data-rm]').forEach(a=>a.onclick=()=>{W.councilMembers=W.councilMembers.filter(x=>x!==a.dataset.rm);save();draw()});
  };draw();
}};

let repTab='card',repSid=null,repCol='m0';
V.reports={title:'របាយការណ៍ និងផែនការ',render(el){
  if(!repSid||!DB.students.find(s=>s.id===repSid))repSid=DB.students[0]?.id;
  if(repCol==='m0'&&latestMonth()>=0)repCol='m'+latestMonth();
  const draw=()=>{
    let body='';
    if(repTab==='card'){
      const s=DB.students.find(x=>x.id===repSid);
      if(!s)body='<div class="empty">មិនមានសិស្ស</div>';
      else{
        const rows=DB.subjects.map(b=>({b,v:DB.scores[s.id]?.[b.id]?.[repCol]}));
        const a=avgOf(s.id,repCol),all=DB.students.map(x=>avgOf(x.id,repCol)).filter(x=>x!=null).sort((x,y)=>y-x);
        const rk=a==null?null:all.indexOf(a)+1;
        body=`<div class="row" style="margin-bottom:10px"><select class="in" id="rs" style="max-width:260px" aria-label="សិស្ស">${DB.students.map(x=>`<option value="${x.id}" ${x.id===repSid?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <select class="in" id="rc" style="max-width:180px" aria-label="រយៈពេល">${COLS.map(c=>`<option value="${c.k}" ${c.k===repCol?'selected':''}>${c.n}</option>`).join('')}</select></div>
        <div class="card"><h3>ព្រឹត្តិបត្រពិន្ទុ · ${esc(s.name)} · ${COLS.find(c=>c.k===repCol).n}</h3>
        <div class="tw"><table><thead><tr><th>មុខវិជ្ជា</th><th class="c">មេគុណ</th><th class="c">ពិន្ទុ</th><th>និទ្ទេស</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.b.name)}</td><td class="c num">${kh(r.b.coef)}</td><td class="c num">${r.v===undefined?'—':fx(r.v,1)}</td><td>${r.v===undefined?'—':gpill(Number(r.v))}</td></tr>`).join('')}
        <tr><td><b>មធ្យមភាគ</b></td><td></td><td class="c num"><b>${fx(a)}</b></td><td>${gpill(a)}</td></tr></tbody></table></div>
        <p>ចំណាត់ថ្នាក់ក្នុងថ្នាក់៖ <b>${rk?kh(rk)+' / '+kh(all.length):'—'}</b> · អវត្តមាន <b>${kh(absentCount(s.id))}</b> ដង</p></div>`;
      }
    }else if(repTab==='sub'){
      body=`<div class="tw"><table><thead><tr><th>មុខវិជ្ជា</th><th class="c">មធ្យមភាគឆ្នាំ</th>${GR.map(g=>`<th class="c">${g[1]}</th>`).join('')}</tr></thead><tbody>
      ${DB.subjects.map(b=>{const vals=[];DB.students.forEach(s=>{const o=DB.scores[s.id]?.[b.id];if(o){const v=Object.values(o).map(Number);if(v.length)vals.push(v.reduce((p,c)=>p+c,0)/v.length)}});

<script>
/* ---------- data model: ROOT = school; ROOT.classes[] each hold their own students/scores/attendance ---------- */
const DEF_SUBJ=()=>[
  {id:'s_km',name:'ភាសាខ្មែរ',coef:4},{id:'s_ma',name:'គណិតវិទ្យា',coef:4},{id:'s_ph',name:'រូបវិទ្យា',coef:2},{id:'s_ch',name:'គីមីវិទ្យា',coef:2},

const RULES='១. មកដល់សាលាមុនម៉ោង ៦:៤៥ ព្រឹក។\n២. ស្លៀកពាក់ឯកសណ្ឋានស្អាតស្អំ។\n៣. រក្សាអនាម័យថ្នាក់រៀន។\n៤. គោរពគ្រូ និងមិត្តភក្តិ។';
function emptyClass(name,teacher){
  return {id:'c'+uid(),name,teacher:teacher||'',pw:'1234',students:[],subjects:DEF_SUBJ(),scores:{},att:{},work:{clean:{},seat:[],sched:{},rules:RULES}};
}
function emptyRoot(){
  return {settings:{school:'វិទ្យាល័យគំរូ',year:'២០២៦-២០២៧',pwA:'0000',province:'',district:'',principal:'',place:''},classes:[emptyClass('ថ្នាក់ទី ៧ក','')],teachers:[],notices:[]};
}
function migrate(o){ /* v1 single-class data -> school with one class */
  const c=emptyClass(o.settings?.className||'ថ្នាក់ទី ៧ក',o.settings?.teacher||'');
  Object.assign(c,{students:o.students,subjects:o.subjects||c.subjects,scores:o.scores||{},att:o.att||{},work:o.work||c.work,pw:o.settings?.pwT||'1234'});
  return {settings:{school:o.settings?.school||'វិទ្យាល័យគំរូ',year:o.settings?.year||'២០២៦-២០២៧',pwA:o.settings?.pwA||'0000'},classes:[c],teachers:o.teachers||[],notices:o.notices||[]};
}
function demoClass(name,teacher,n,seedv,q){
  const c=emptyClass(name,teacher);
  const L=['សុខ','ហេង','លី','ចាន់','គីម','ប៊ុន','សេង','ឈឹម','ម៉ៅ','ខូច','នួន','ពៅ','ស៊ឹម','យ៉ែម'];
  const M=['វិបុល','សុភក្ត្រ','វិសាល','ឆេតា','ពិសី','វណ្ណៈ','រ័ត្ន','សុធា'],F=['មរកត','ស្រីនាង','ស្រីលីម','សុភា','ចិន្តា','ដារ៉ា','សោភា','ស្រីពៅ'];
  let r=seedv*7919+12345;const rnd=()=>(r=(r*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<n;i++){
    const boy=i%2===0,nm=L[(i+seedv)%L.length]+' '+(boy?M[(i*3+seedv)%M.length]:F[(i*3+seedv)%F.length]);
    c.students.push({id:'s'+seedv+'_'+i,name:nm,sex:boy?'ប្រុស':'ស្រី',dob:`${2011+(i%3)}-0${1+(i%9)}-1${i%9}`,guardian:'អាណាព្យាបាល '+nm.split(' ')[0],phone:'012 '+(300+i*13)+' '+(100+i*37),
      w:Math.round(38+rnd()*28),h:(boy?165:155)+Math.round(rnd()*12)});
  }
  c.students.forEach((s,i)=>{
    const base=5.2+(i%6)*0.75+rnd()*0.8+q;c.scores[s.id]={};
    c.subjects.forEach(b=>{c.scores[s.id][b.id]={};for(let m=0;m<3;m++)c.scores[s.id][b.id]['m'+m]=Math.max(2,Math.min(10,Math.round((base+(rnd()-.5)*2.4+m*.1)*2)/2))});
  });
  const t=new Date();
  for(let k=1;k<=6;k++){const dt=new Date(t);dt.setDate(t.getDate()-k);const key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    c.att[key]={};c.students.forEach((s,i)=>{const x=rnd();c.att[key][s.id]=(i===3&&k<5)?'A':x<.07?'A':x<.12?'L':'P'})}
  return c;
}
const IMPORTED_ROSTER={school:'វិទ្យាល័យសុខអានព្រៃមេលង',classes:[]};
function seed(){
  const R=emptyRoot();
  R.classes=[demoClass('ថ្នាក់ទី ៧ក','គ្រូ សុភាព',12,1,0),demoClass('ថ្នាក់ទី ៧ខ','គ្រូ វណ្ណា',14,2,-.5),demoClass('ថ្នាក់ទី ៨ក','គ្រូ ចន្ទ្រា',11,3,.6)];
  if(typeof IMPORTED_ROSTER!=='undefined'&&IMPORTED_ROSTER.classes.length){R.classes=IMPORTED_ROSTER.classes.map(k=>{const c=emptyClass(k.name,'');c.students=k.students.map(s=>({id:'st'+uid(),name:s.name,sex:s.sex,dob:s.dob,guardian:s.guardian,phone:s.phone,note:s.code}));return c});if(IMPORTED_ROSTER.school)R.settings.school=IMPORTED_ROSTER.school;}
  R.teachers=[{id:'t1',name:'គ្រូ សុភាព',subject:'ភាសាខ្មែរ',phone:'012 111 222'},{id:'t2',name:'គ្រូ វណ្ណា',subject:'គណិតវិទ្យា',phone:'012 333 444'},
    {id:'t3',name:'គ្រូ ចន្ទ្រា',subject:'រូបវិទ្យា',phone:'012 555 666'},{id:'t4',name:'គ្រូ សោភ័ណ',subject:'ភាសាអង់គ្លេស',phone:'012 777 888'}];
  R.notices=[{id:'n1',title:'កាលបរិច្ឆេទប្រឡងប្រចាំខែ',body:'ការប្រឡងប្រចាំខែនឹងប្រព្រឹត្តទៅចុងសប្តាហ៍នេះ។ សូមគ្រូបន្ទុកថ្នាក់ជូនដំណឹងដល់សិស្ស។',date:todayStr()}];
  return R;
}

/* bind DB (the class-level view used by all class screens) to one class of ROOT */
function bind(cid){
  const c=ROOT.classes.find(x=>x.id===cid);CUR=c;const o={};
  ['students','subjects','scores','att','work'].forEach(k=>Object.defineProperty(o,k,{get:()=>c[k],set:v=>{c[k]=v},enumerable:true}));
  Object.defineProperty(o,'rep',{get:()=>(c.rep??={}),enumerable:true});
  ['teachers','notices'].forEach(k=>Object.defineProperty(o,k,{get:()=>ROOT[k],set:v=>{ROOT[k]=v},enumerable:true}));
  o.settings={get school(){return ROOT.settings.school},get year(){return ROOT.settings.year},get className(){return c.name},get teacher(){return c.teacher||'គ្រូបន្ទុកថ្នាក់'}};
  DB=o;
}

/* tidy freshly rendered content: drop leading emoji from headings, colour score cells */
const EMO=/^[\p{Extended_Pictographic}️‍\s]+/u;
function polish(){
  const c=$('#content');
  c.querySelectorAll('.ph h2, .card h3, .card>h2').forEach(h=>{const t=h.firstChild;if(t&&t.nodeType===3&&EMO.test(t.nodeValue))t.nodeValue=t.nodeValue.replace(EMO,'')});
  c.querySelectorAll('.card[style*="linear-gradient"]').forEach(h=>{h.removeAttribute('style');h.classList.add('hero')});
  c.querySelectorAll('tr[data-id] input.cell:not([data-f])').forEach(tint);
}
function tint(i){const v=parseFloat(i.value);i.classList.toggle('lo',!isNaN(v)&&v<5);i.classList.toggle('hi',!isNaN(v)&&v>=8)}
/* admin viewing a class: read-only (inputs disabled, edit buttons hidden) */
const RO_KEEP=['colSel','rs','rc','ps','ad','pq'];
function applyRO(){
  if(!RO)return;const c=$('#content');
  c.querySelectorAll('input,textarea,select').forEach(e=>{if(!RO_KEEP.includes(e.id))e.disabled=true});
  c.querySelectorAll('[data-s], .att3 button').forEach(b=>b.disabled=true);
  c.querySelectorAll('.btn.pri,.btn.dng,#allP,#clrA,[data-e]').forEach(b=>b.style.display='none');
}
function markStk(){
  $('#content').querySelectorAll('.tw table').forEach(t=>{const h=[...t.querySelectorAll('thead th')];if(h[1]&&/គោត្តនាម|ឈ្មោះ|សិស្ស/.test(h[1].textContent))t.classList.add('stk')})}

/* ---------- global student search (dropdown) ---------- */
let sAct=-1;
function searchPool(){return ROLE==='admin'&&!VIEWCLASS?ROOT.classes:[CUR]}
function runSearch(){
  const q=$('#gsearch').value.trim().toLowerCase(),box=$('#sres');sAct=-1;
  if(!q){box.hidden=true;return}
  const out=[];let total=0;
  for(const c of searchPool())for(const s of c.students){
    if([s.name,s.guardian,s.phone,s.note].join(' ').toLowerCase().includes(q)){total++;if(out.length<40)out.push({c,s})}}
  box.innerHTML=out.length?`<div class="hd">រកឃើញ ${kh(total)} នាក់${total>out.length?' · បង្ហាញ '+kh(out.length):''}</div>`+out.map(r=>`<button data-prof="${r.s.id}" data-cid="${r.c.id}">${avatar(r.s)}<span style="min-width:0"><b>${esc(r.s.name)}</b><small>${esc(r.c.name)} · ${esc(r.s.sex||'—')}${r.s.note?' · '+esc(r.s.note):''}${r.s.phone?' · '+esc(r.s.phone):''}</small></span></button>`).join(''):'<div class="empty" style="padding:18px">រកមិនឃើញសិស្ស</div>';
  box.hidden=false;
}
$('#gsearch').addEventListener('input',runSearch);
$('#gsearch').addEventListener('focus',()=>{if($('#gsearch').value)runSearch()});
$('#gsearch').addEventListener('keydown',e=>{
  const bs=[...$('#sres').querySelectorAll('button')];
  if(e.key==='Escape'){$('#gsearch').value='';$('#sres').hidden=true;$('#gsearch').blur();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!bs.length)return;sAct=(sAct+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('act',i===sAct));bs[sAct].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){e.preventDefault();(bs[sAct]||bs[0])?.click()}
});

/* ---------- student profile card ---------- */
function studentProfile(cid,sid){
  const c=ROOT.classes.find(x=>x.id===cid)||CUR,s=c.students.find(x=>x.id===sid);if(!s)return;
  const d=withClass(c,()=>{
    let p=0,l=0,a=0;for(const day of Object.values(DB.att)){const v=day[sid];if(v==='P')p++;else if(v==='L')l++;else if(v==='A')a++}
    const rk=rankMap(yearAvg);
    return {months:MONTHS.map((_,i)=>avgOf(sid,'m'+i)),ya:yearAvg(sid),p,l,a,rk:rk[sid],n:Object.keys(rk).length};
  });
  const tot=d.p+d.l+d.a,age=ageOf(s),canOpen=ROLE==='admin'&&(VIEWCLASS!==c.id);
  modal(`<div class="prof-h">${avatar(s,'xl')}<div style="flex:1;min-width:0"><h3>${esc(s.name)}</h3><div style="color:var(--muted)">${esc(c.name)} · ${esc(s.sex||'—')}${age!=null?' · អាយុ '+kh(age)+' ឆ្នាំ':''}</div></div>
    ${d.ya!=null?gpill(d.ya):''}</div>
  <div class="mini"><div><b class="num">${d.ya==null?'—':fx(d.ya)}</b><small>មធ្យមភាគឆ្នាំ</small></div><div><b class="num">${d.rk?kh(d.rk)+'/'+kh(d.n):'—'}</b><small>ចំណាត់ថ្នាក់</small></div>
    <div><b class="num">${tot?fx((d.p+d.l)/tot*100,0)+'%':'—'}</b><small>វត្តមាន</small></div><div><b class="num" style="color:${d.a>=3?'var(--danger)':'inherit'}">${kh(d.a)}</b><small>អវត្តមាន</small></div></div>
  ${d.months.some(v=>v!=null)?`<div style="margin:6px 0 10px">${barChart(MONTHS,d.months,10,150)}</div>`:''}
  <dl class="kv">
    <dt>អត្តលេខ</dt><dd>${esc(s.studentCode||s.note||'—')}</dd>
    <dt>ថ្ងៃខែឆ្នាំកំណើត</dt><dd>${s.dob?kh(s.dob.split('-').reverse().join('/')):'—'}</dd>
    <dt>អាណាព្យាបាល</dt><dd>${esc(s.guardian||'—')}</dd>
    <dt>ទូរស័ព្ទ</dt><dd>${s.phone?`<a href="tel:${esc(s.phone.replace(/\s/g,''))}" style="color:var(--accent)">${esc(s.phone)}</a>`:'—'}</dd>
  </dl>
  <div class="row" style="justify-content:flex-end;margin-top:16px">${canOpen?`<button class="btn" data-open>${ic('classes',16)} បើកថ្នាក់ ${esc(c.name)}</button>`:''}<button class="btn pri" data-x>បិទ</button></div>`,m=>{
    m.firstChild.classList.add('wide');
    m.querySelector('[data-x]').onclick=()=>m.remove();
    const o=m.querySelector('[data-open]');if(o)o.onclick=()=>{m.remove();viewClass(c.id)};
  });
}
document.addEventListener('click',e=>{const p=e.target.closest('[data-prof]');if(!p)return;e.preventDefault();$('#sres').hidden=true;studentProfile(p.dataset.cid||CUR.id,p.dataset.prof)});

/* ---------- keyboard: "/" or Ctrl+K search, Esc closes dialogs, Enter/↑/↓ move between score cells ---------- */
document.addEventListener('keydown',e=>{
  const t=e.target,typing=t.matches?.('input,textarea,select,[contenteditable="true"]');
  if(e.key==='Escape'){const m=[...document.querySelectorAll('.modal')].pop();if(m){m.remove();return}}
  if(((e.key==='/'&&!typing)||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey)))&&!$('#app').hidden&&!$('#srch').hidden){e.preventDefault();$('#gsearch').focus();$('#gsearch').select();return}
  if(t.matches?.('#content td input.cell')&&['Enter','ArrowDown','ArrowUp'].includes(e.key)){
    const td=t.closest('td'),idx=[...td.parentElement.children].indexOf(td),up=e.key==='ArrowUp';
    let r=td.parentElement;do{r=up?r.previousElementSibling:r.nextElementSibling}while(r&&!r.children[idx]?.querySelector('input.cell'));
    const n=r?.children[idx]?.querySelector('input.cell');if(n){e.preventDefault();n.focus();n.select()}
  }
});
document.addEventListener('input',e=>{if(e.target.matches?.('tr[data-id] input.cell:not([data-f])'))tint(e.target)});
