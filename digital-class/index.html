function fillClassSelect(){
  const list=loginRole==='teacher'?ROOT.classes:ROOT.classes.filter(c=>c.published!==false);
  $('#loginClass').innerHTML=list.map(c=>`<option value="${c.id}">${esc(c.name)}${c.teacher&&loginRole==='teacher'?' · '+esc(c.teacher):''}</option>`).join('')||'<option value="">មិនទាន់មានថ្នាក់បង្ហាញ</option>';
  $('#loginTeacher').innerHTML=ROOT.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}${t.subject?' · '+esc(t.subject):''}</option>`).join('')||'<option value="">មិនទាន់មានគ្រូ</option>';
  fillStudentSelect();
}
function fillStudentSelect(){
  const c=ROOT.classes.find(x=>x.id===$('#loginClass').value);
  $('#loginStudent').innerHTML=c?[...c.students].sort((a,b)=>a.name.localeCompare(b.name,'km')).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join(''):'';
}
function setRole(r){
  loginRole=r;
  document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===r));
  $('#classRow').hidden=!['teacher','student','guardian'].includes(r);
  $('#fTeacher').hidden=r!=='subject';
  $('#fStudent').hidden=!['student','guardian'].includes(r);
  $('#loginHint').textContent=HINTS[r];$('#loginErr').textContent='';
  fillClassSelect();
}
$('#roleSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-r]');if(b)setRole(b.dataset.r)});
$('#loginClass').addEventListener('change',fillStudentSelect);
$('#loginForm').addEventListener('submit',e=>{if(window.DIGITAL_CLASS_REQUIRED){e.preventDefault();return;}
  e.preventDefault();
  const pw=$('#pw').value,cid=$('#loginClass').value,c=ROOT.classes.find(x=>x.id===cid);
  let ok=false;
  if(loginRole==='admin')ok=pw===ROOT.settings.pwA;
  else if(loginRole==='teacher')ok=!!c&&pw===c.pw;
  else if(loginRole==='subject'){const t=ROOT.teachers.find(x=>x.id===$('#loginTeacher').value);ok=!!t&&pw===(t.pw||'1234');if(ok)SUBJT=t}
  else{const s=c?.students.find(x=>x.id===$('#loginStudent').value);ok=!!s&&pw===pinOf(s,loginRole==='student'?'S':'G');if(ok)ME={cid,sid:s.id}}
  if(!ok){$('#loginErr').textContent='លេខសម្ងាត់មិនត្រឹមត្រូវ';return}
  ROLE=loginRole;VIEWCLASS=null;RO=false;
  if(['teacher','student','guardian'].includes(ROLE))bind(cid);else bind(ROOT.classes[0].id);
  $('#pw').value='';$('#loginErr').textContent='';
  $('#login').hidden=true;$('#app').hidden=false;location.hash='';render();
});
function logout(){VIEWCLASS=null;RO=false;SUBJT=null;ME=null;$('#gsearch').value='';peopleQ='';$('#app').hidden=true;$('#login').hidden=false;loginHero();setRole('teacher');document.title='ថ្នាក់ឌីជីថល';$('#pw').focus()}

/* ---------- boot ---------- */
ROOT=load();
if(!ROOT||!ROOT.classes){ROOT=seed();save()}
ROOT.teachers??=[];ROOT.notices??=[];for(const k of ['province','district','principal','place'])ROOT.settings[k]??='';
ROOT.classes.forEach(c=>{c.att??={};c.work??={clean:{},seat:[],sched:{},rules:RULES};c.pw??='1234'});
bind(ROOT.classes[0].id);
hydrateIcons();
function loginHero(){
  const n=ROOT.classes.reduce((a,c)=>a+c.students.length,0);
  $('#lgSchool').textContent=ROOT.settings.school||'ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀន';
  $('#lgStats').innerHTML=`<div><b>${kh(ROOT.classes.length)}</b><small>ថ្នាក់រៀន</small></div><div><b>${kh(n)}</b><small>សិស្ស</small></div><div><b>${esc(ROOT.settings.year||'')}</b><small>ឆ្នាំសិក្សា</small></div>`;
}
loginHero();
setRole('teacher');
$('#login').hidden=false;
</script>
<script>
/* ---------- admin (school-level) views + teacher class settings ---------- */
function classStats(c){
  return withClass(c,()=>{
    const lm=latestMonth(),avg=lm<0?null:monthlyClassAvg(lm),ar=attRate();
    const ya=DB.students.map(s=>yearAvg(s.id)).filter(x=>x!=null);
    return {c,n:DB.students.length,boys:DB.students.filter(s=>s.sex==='ប្រុស').length,avg,ar,risk:atRisk().length,
      pass:ya.length?ya.filter(a=>a>=5).length/ya.length*100:null,lm};
  });
}
const mean=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:null;

V.school={title:'ទិដ្ឋភាពទូទៅនៃសាលា',render(el){
  const st=ROOT.classes.map(classStats);
  const total=st.reduce((a,s)=>a+s.n,0),avg=mean(st.map(s=>s.avg).filter(x=>x!=null)),ar=mean(st.map(s=>s.ar).filter(x=>x!=null));
  const risk=st.reduce((a,s)=>a+s.risk,0);
  const noTeacher=ROOT.classes.filter(c=>!c.teacher).length;
  el.innerHTML=`<div class="page"><div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,var(--blue-soft),var(--surface))">
    <h2 style="font-size:18px">ទិដ្ឋភាពសាលា · ${esc(ROOT.settings.school)}</h2>
    <div style="color:var(--muted)">ឆ្នាំសិក្សា ${esc(ROOT.settings.year)} · ${khDate()}</div></div>
  <div class="grid g4">
    <div class="card stat"><div class="k">ថ្នាក់រៀន</div><div class="v num">${kh(ROOT.classes.length)}</div><div class="s">${noTeacher?kh(noTeacher)+' ថ្នាក់មិនទាន់មានគ្រូ':'មានគ្រូគ្រប់ថ្នាក់'}</div></div>
    <div class="card stat"><div class="k">សិស្សទូទាំងសាលា</div><div class="v num">${kh(total)}</div><div class="s">គ្រូ ${kh(ROOT.teachers.length)} នាក់</div></div>
    <div class="card stat"><div class="k">មធ្យមភាគសាលា</div><div class="v num">${avg==null?'—':fx(avg)}</div></div>
    <div class="card stat"><div class="k">សិស្សប្រឈមហានិភ័យ</div><div class="v num" style="color:${risk?'var(--danger)':'var(--ok)'}">${kh(risk)}</div><div class="s">អត្រាចូលរៀន ${ar==null?'—':fx(ar,1)+'%'}</div></div>
  </div>
  <div class="sec">ប្រៀបធៀបថ្នាក់នីមួយៗ</div>
  <div class="card"><h3>មធ្យមភាគថ្នាក់ (ខែចុងក្រោយ)</h3>${barChart(st.map(s=>s.c.name.replace('ថ្នាក់ទី ','')),st.map(s=>s.avg))}</div>
  <div class="tw" style="margin-top:14px"><table><thead><tr><th>ថ្នាក់</th><th>គ្រូបន្ទុក</th><th class="c">សិស្ស</th><th class="c">មធ្យមភាគ</th><th class="c">ជាប់</th><th class="c">ចូលរៀន</th><th class="c">ហានិភ័យ</th><th></th></tr></thead><tbody>
  ${st.map(s=>`<tr><td><b>${esc(s.c.name)}</b></td><td>${esc(s.c.teacher||'—')}</td><td class="c num">${kh(s.n)}</td><td class="c num">${fx(s.avg)}</td><td class="c num">${s.pass==null?'—':fx(s.pass,0)+'%'}</td><td class="c num">${s.ar==null?'—':fx(s.ar,0)+'%'}</td><td class="c">${s.risk?`<span class="pill bad">${kh(s.risk)}</span>`:'<span class="pill ok">០</span>'}</td><td><button class="btn sm" data-v="${s.c.id}">គ្រប់គ្រងថ្នាក់</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>viewClass(b.dataset.v));
}};
function viewClass(id){VIEWCLASS=id;RO=false;bind(id);location.hash='dash';render()}

V.classes={title:'គ្រប់គ្រងថ្នាក់រៀន',render(el){
  const draw=()=>{
    el.innerHTML=`<div class="page"><div class="ph"><h2>🗂 គ្រប់គ្រងថ្នាក់រៀន</h2><div class="row"><button class="btn sm" id="pubAll">បង្ហាញដល់គ្រូទាំងអស់</button><button class="btn sm" id="hideAll">លាក់ទាំងអស់</button><button class="btn pri sm" id="addC">＋ បង្កើតថ្នាក់ថ្មី</button></div></div>
    <div class="tw"><table><thead><tr><th>ឈ្មោះថ្នាក់</th><th>គ្រូបន្ទុក</th><th class="c">សិស្ស</th><th class="c">បង្ហាញដល់គ្រូ</th><th>លេខសម្ងាត់គ្រូ</th><th></th></tr></thead><tbody>
    ${ROOT.classes.map(c=>`<tr><td><input class="in" style="min-width:140px" data-n="${c.id}" value="${esc(c.name)}" aria-label="ឈ្មោះថ្នាក់"></td>
      <td><select class="in" style="min-width:160px" data-t="${c.id}" aria-label="គ្រូបន្ទុក"><option value="">— មិនទាន់កំណត់ —</option>${ROOT.teachers.map(t=>`<option ${t.name===c.teacher?'selected':''}>${esc(t.name)}</option>`).join('')}</select></td>
      <td class="c num">${kh(c.students.length)}</td>
      <td class="c"><button class="btn sm ${c.published===false?'':'pri'}" data-pub="${c.id}" aria-pressed="${c.published!==false}">${c.published===false?'លាក់':'បង្ហាញ'}</button></td>
      <td><button class="btn sm" data-p="${c.id}">កំណត់ថ្មី</button></td>
      <td><button class="btn sm" data-v="${c.id}">គ្រប់គ្រងថ្នាក់</button> <button class="btn sm dng" data-x="${c.id}">លុប</button></td></tr>`).join('')}
    </tbody></table></div><p style="color:var(--muted);font-size:13px">ចុច “គ្រប់គ្រងថ្នាក់” ដើម្បីចូលកែប្រែទិន្នន័យថ្នាក់នោះដោយផ្ទាល់ (ពិន្ទុ វត្តមាន សិស្ស ការកំណត់)។</p></div>`;
    $('#pubAll').onclick=()=>{ROOT.classes.forEach(c=>c.published=true);save();toast('បានបង្ហាញទាំងអស់');draw()};
    $('#hideAll').onclick=()=>{ROOT.classes.forEach(c=>c.published=false);save();toast('បានលាក់ទាំងអស់');draw()};
    $('#addC').onclick=()=>{ROOT.classes.push(emptyClass('ថ្នាក់ថ្មី',''));save();draw()};
    el.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>{ROOT.classes.find(c=>c.id===i.dataset.n).name=i.value.trim()||'ថ្នាក់';save()});
    el.querySelectorAll('[data-t]').forEach(i=>i.onchange=()=>{ROOT.classes.find(c=>c.id===i.dataset.t).teacher=i.value;save();toast('បានកំណត់គ្រូ')});
    el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>viewClass(b.dataset.v));
    el.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>{const c=ROOT.classes.find(x=>x.id===b.dataset.pub);c.published=c.published===false;save();toast(c.published===false?'លាក់ពីគ្រូ':'បានបង្ហាញដល់គ្រូ');draw()});
    el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      const c=ROOT.classes.find(x=>x.id===b.dataset.p);
      modal(`<h3>លេខសម្ងាត់ថ្មី · ${esc(c.name)}</h3><div style="margin:6px 0">លេខសម្ងាត់បច្ចុប្បន្ន៖ <b class="num">${esc(c.pw)}</b></div><label class="f" for="np1">លេខសម្ងាត់ថ្មី (យ៉ាងតិច ៤ខ្ទង់)</label><input class="in" id="np1" type="password" inputmode="numeric"><div class="err" id="npe"></div>
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-x>បោះបង់</button><button class="btn pri" data-ok>រក្សាទុក</button></div>`,m=>{
        m.querySelector('[data-x]').onclick=()=>m.remove();
        m.querySelector('[data-ok]').onclick=()=>{const v=$('#np1',m).value;if(v.length<4){$('#npe',m).textContent='ខ្លីពេក';return}c.pw=v;save();m.remove();toast('បានប្តូរលេខសម្ងាត់')}})});
    el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
      if(ROOT.classes.length<2){toast('ត្រូវមានយ៉ាងតិចមួយថ្នាក់');return}
      const c=ROOT.classes.find(x=>x.id===b.dataset.x);
      ask(`លុបថ្នាក់ “${c.name}” រួមទាំងសិស្ស ${c.students.length}នាក់ និងពិន្ទុទាំងអស់?`,()=>{ROOT.classes=ROOT.classes.filter(x=>x.id!==c.id);save();draw()})});
  };draw();
}};

V.staff={title:'បុគ្គលិក និងគ្រូ',render(el){
  const draw=()=>{
    el.innerHTML=`<div class="page"><div class="ph"><h2>👥 បុគ្គលិក និងគ្រូ</h2><button class="btn pri sm" id="addT">＋ បន្ថែមគ្រូ</button></div>
    <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>ឈ្មោះ</th><th>មុខវិជ្ជាបង្រៀន</th><th>ទូរស័ព្ទ</th><th>ថ្នាក់បន្ទុក</th><th></th></tr></thead><tbody>
    ${ROOT.teachers.map((t,i)=>{const cl=ROOT.classes.filter(c=>c.teacher===t.name).map(c=>c.name).join(', ');return `<tr><td class="c num">${kh(i+1)}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.subject||'—')}</td><td>${esc(t.phone||'—')}</td><td><select class="in" style="min-width:150px" data-as="${t.id}" aria-label="ថ្នាក់បន្ទុក"><option value="">— គ្មាន —</option>${ROOT.classes.map(c=>`<option value="${c.id}" ${c.teacher===t.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td><td><button class="btn sm" data-te="${t.id}">កែ</button> <button class="btn sm" data-tp="${t.id}">លេខសម្ងាត់</button> <button class="btn sm dng" data-td="${t.id}">លុប</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">មិនទាន់មានគ្រូ</td></tr>'}
    </tbody></table></div></div>`;

      modal(`<h3>លេខសម្ងាត់គ្រូមុខវិជ្ជា · ${esc(t.name)}</h3><div style="margin:6px 0">បច្ចុប្បន្ន៖ <b class="num">${esc(t.pw||'1234')}</b></div><label class="f" for="tpw">លេខសម្ងាត់ថ្មី (យ៉ាងតិច ៤ខ្ទង់)</label><input class="in" id="tpw" type="password" inputmode="numeric"><div class="err" id="tpe"></div>
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-x>បោះបង់</button><button class="btn pri" data-ok>រក្សាទុក</button></div>`,m=>{
        m.querySelector('[data-x]').onclick=()=>m.remove();
        m.querySelector('[data-ok]').onclick=()=>{const v=$('#tpw',m).value;if(v.length<4){$('#tpe',m).textContent='ខ្លីពេក';return}t.pw=v;save();m.remove();toast('បានប្តូរលេខសម្ងាត់')}})});
    el.querySelectorAll('[data-as]').forEach(sel=>sel.onchange=()=>{const t=ROOT.teachers.find(x=>x.id===sel.dataset.as);ROOT.classes.forEach(c=>{if(c.teacher===t.name)c.teacher=''});if(sel.value)ROOT.classes.find(c=>c.id===sel.value).teacher=t.name;save();toast('បានកំណត់ថ្នាក់បន្ទុក');draw()});
    el.querySelectorAll('[data-te]').forEach(b=>b.onclick=()=>teacherForm(b.dataset.te));
    el.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>ask('លុបគ្រូនេះ?',()=>{const t=ROOT.teachers.find(x=>x.id===b.dataset.td);ROOT.classes.forEach(c=>{if(c.teacher===t.name)c.teacher=''});ROOT.teachers=ROOT.teachers.filter(x=>x!==t);save();draw()}));
  };
  AFTER=draw;V.staff.redraw=draw;draw();
}};
/* teacherForm (from the people view) redraws through V.people; point it at staff when on that page */
const _tf=teacherForm;
teacherForm=function(id){
  const old=ROOT.teachers.find(t=>t.id===id)?.name;
  _tf(id);
  const m=document.querySelector('.modal [data-ok]');
  if(m){const prev=m.onclick;m.onclick=()=>{
    const nm=document.querySelector('#tn').value.trim();
    if(old&&nm&&nm!==old)ROOT.classes.forEach(c=>{if(c.teacher===old)c.teacher=nm});
    prev()}}
};

V.sreports={title:'របាយការណ៍ទូទាំងសាលា',render(el){
  const all=[];ROOT.classes.forEach(c=>withClass(c,()=>DB.students.forEach(s=>{const a=yearAvg(s.id);if(a!=null)all.push({s,a,cn:c.name})})));
  all.sort((a,b)=>b.a-a.a);
  const risk=[];ROOT.classes.forEach(c=>withClass(c,()=>atRisk().forEach(r=>risk.push({...r,cn:c.name}))));
  const subj={};ROOT.classes.forEach(c=>withClass(c,()=>DB.subjects.forEach(b=>{const v=[];DB.students.forEach(s=>{const o=DB.scores[s.id]?.[b.id];if(o){const x=Object.values(o).map(Number);if(x.length)v.push(mean(x))}});if(v.length)(subj[b.name]??={})[c.name]=mean(v)})));
  const cn=ROOT.classes.map(c=>c.name);
  el.innerHTML=`<div class="page"><div class="ph"><h2>📈 របាយការណ៍ទូទាំងសាលា</h2></div>
  <div class="grid g2"><div class="card"><h3>🏆 សិស្សពូកែកំពូល ១០នាក់ទូទាំងសាលា</h3>
    ${all.slice(0,10).map((r,i)=>`<div class="rank"><div class="n">${kh(i+1)}</div><div class="nm"><b>${esc(r.s.name)}</b><div style="font-size:13px;color:var(--muted)">${esc(r.cn)}</div></div><b class="num">${fx(r.a)}</b></div>`).join('')||'<div class="empty">មិនទាន់មានពិន្ទុ</div>'}</div>

    ${risk.map(r=>`<div class="rank"><div class="nm"><b>${esc(r.s.name)}</b><div style="font-size:13px;color:var(--muted)">${esc(r.cn)} · ${r.why.join(' · ')}</div></div><span class="pill bad">${fx(r.a)}</span></div>`).join('')||'<div class="empty">គ្មាន</div>'}</div></div>

  $('#bkGen').onclick=()=>{$('#bk').value=JSON.stringify({classBackup:1,data:{students:CUR.students,subjects:CUR.subjects,scores:CUR.scores,att:CUR.att,work:CUR.work}})};

  $('#bkIn').onclick=()=>restore($('#bk').value);

  $('#demo').onclick=()=>ask('ជំនួសទិន្នន័យទាំងអស់ដោយទិន្នន័យគំរូ?',()=>{ROOT=seed();save();bind(ROOT.classes[0].id);go('school')});
  $('#wipe').onclick=()=>ask('លុបទិន្នន័យទាំងអស់? មិនអាចត្រឡប់វិញបានទេ។',()=>{const s=ROOT.settings;ROOT=emptyRoot();ROOT.settings=s;save();bind(ROOT.classes[0].id);go('school')});

<script>
/* ---------- export & print: official A4 documents (inline styles so they paste cleanly into Word / Excel) ---------- */
const TS='border-collapse:collapse;width:100%;font-size:12px;color:#000;margin-top:6px';
const TD='border:1px solid #000;padding:3px 6px;vertical-align:middle;color:#000';
const TH=(t,ex='')=>`<th style="${TD};background:#e9e9e9;font-weight:700;text-align:center;${ex}">${t}</th>`;
const TC=(t,al='left',ex='')=>`<td style="${TD};text-align:${al};${ex}">${t}</td>`;
const MOUL="font-family:'Khmer OS Muol Light','Khmer OS Muol','Moul',serif;font-weight:400";
const KM_MONTH=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
const dots=(v,n='……………')=>v?esc(v):n;
function khLong(d=new Date()){return `ថ្ងៃទី ${kh(d.getDate())} ខែ${KM_MONTH[d.getMonth()]} ឆ្នាំ${kh(d.getFullYear())}`}

function docHeader(title,sub){
  const s=ROOT.settings;
  return `<table style="width:100%;border-collapse:collapse;color:#000"><tr>
    <td style="width:50%;text-align:center;vertical-align:top;font-size:12px;line-height:1.7">
      មន្ទីរអប់រំ យុវជន និងកីឡា ខេត្ត${dots(s.province)}<br>ការិយាល័យអប់រំ យុវជន និងកីឡា ស្រុក${dots(s.district)}<br><b>${esc(s.school)}</b></td>
    <td style="width:50%;text-align:center;vertical-align:top;line-height:1.9">
      <div style="${MOUL};font-size:13px">ព្រះរាជាណាចក្រកម្ពុជា</div><div style="${MOUL};font-size:12px">ជាតិ សាសនា ព្រះមហាក្សត្រ</div><div>❖ ❖ ❖</div></td></tr></table>
    <div style="text-align:center;margin:10px 0 2px;${MOUL};font-size:15px;line-height:1.8">${title}</div>
    <div style="text-align:center;font-size:12.5px;margin-bottom:6px">${sub}</div>`;
}
function docFooter(mode){
  const s=ROOT.settings,place=dots(s.place,'………………');
  const sign=(t1,t2,name)=>`<div>${t1}</div><div style="font-weight:700">${t2}</div><div style="height:58px"></div><div>${name}</div>`;
  if(mode==='school')return `<table style="width:100%;border-collapse:collapse;color:#000;margin-top:18px;font-size:12.5px"><tr><td style="width:55%"></td><td style="text-align:center;vertical-align:top">ធ្វើនៅ${place} ${khLong()}<br>${sign('','នាយកសាលា',dots(s.principal))}</td></tr></table>`;
  return `<table style="width:100%;border-collapse:collapse;color:#000;margin-top:18px;font-size:12.5px"><tr>
    <td style="width:50%;text-align:center;vertical-align:top"><br>${sign('បានឃើញ និងឯកភាព','នាយកសាលា',dots(s.principal))}</td>
    <td style="width:50%;text-align:center;vertical-align:top">ធ្វើនៅ${place} ${khLong()}<br>${sign('','គ្រូបន្ទុកថ្នាក់',dots(CUR.teacher))}</td></tr></table>`;
}
const clsSub=()=>`${esc(CUR.name)} · ឆ្នាំសិក្សា ${esc(ROOT.settings.year)}`;
const colName=k=>COLS.find(c=>c.k===k)?.n||k;
const sorted=()=>[...DB.students].sort((a,b)=>a.name.localeCompare(b.name,'km'));
function rankMap(avgFn){
  const rows=DB.students.map(s=>({id:s.id,a:avgFn(s.id)})).filter(r=>r.a!=null).sort((x,y)=>y.a-x.a);
  const m={};let rk=0,last=null;rows.forEach((r,i)=>{if(r.a!==last){rk=i+1;last=r.a}m[r.id]=rk});return m;
}
const gl=a=>{const g=grade(a);return g?g[1]+' · '+g[2]:'—'};
const attMonths=()=>[...new Set(Object.keys(DB.att).map(k=>k.slice(0,7)))].sort();

const DOCS={
 students:{n:'បញ្ជីឈ្មោះសិស្ស',o:'p',opts:[],build:()=>{
   const st=sorted(),g=st.filter(s=>s.sex==='ស្រី').length;
   return docHeader('បញ្ជីឈ្មោះសិស្ស',clsSub())+`<table style="${TS}"><thead><tr>${TH('ល.រ','width:36px')}${TH('គោត្តនាម និងនាម')}${TH('ភេទ')}${TH('ថ្ងៃខែឆ្នាំកំណើត')}${TH('អាណាព្យាបាល')}${TH('ទូរស័ព្ទ')}${TH('ផ្សេងៗ')}</tr></thead><tbody>
   ${st.map((s,i)=>`<tr>${TC(kh(i+1),'center')}${TC(esc(s.name))}${TC(esc(s.sex),'center')}${TC(s.dob?kh(s.dob.split('-').reverse().join('/')):'','center')}${TC(esc(s.guardian||''))}${TC(esc(s.phone||''))}${TC('')}</tr>`).join('')}
   <tr>${TC('<b>សរុប</b>','center','" colspan="2')}${TC('<b>'+kh(st.length)+' នាក់</b>','center','" colspan="5')}</tr></tbody></table>
   <p style="margin:6px 0 0">ក្នុងនោះ ស្រី ${kh(g)} នាក់ · ប្រុស ${kh(st.length-g)} នាក់</p>`+docFooter()}},
 scores:{n:'តារាងពិន្ទុតាមមុខវិជ្ជា',o:'l',opts:['col'],build:o=>{
   const rk=rankMap(id=>avgOf(id,o.col));
   return docHeader('តារាងពិន្ទុ '+colName(o.col),clsSub())+`<table style="${TS}"><thead><tr>${TH('ល.រ')}${TH('គោត្តនាម និងនាម')}${TH('ភេទ')}${DB.subjects.map(b=>TH(esc(b.name)+'<br><span style="font-weight:400">(×'+kh(b.coef)+')</span>')).join('')}${TH('មធ្យមភាគ')}${TH('ចំណាត់ថ្នាក់')}${TH('និទ្ទេស')}</tr></thead><tbody>
   ${sorted().map((s,i)=>{const a=avgOf(s.id,o.col);return `<tr>${TC(kh(i+1),'center')}${TC(esc(s.name))}${TC(esc(s.sex),'center')}${DB.subjects.map(b=>{const v=DB.scores[s.id]?.[b.id]?.[o.col];return TC(v===undefined||v===''?'':kh(fx(v,1)),'center')}).join('')}${TC('<b>'+(a==null?'':kh(fx(a)))+'</b>','center')}${TC(rk[s.id]?kh(rk[s.id]):'','center')}${TC(a==null?'':grade(a)[1],'center')}</tr>`}).join('')}
   </tbody></table><p style="margin:6px 0 0;font-size:11.5px">ពិន្ទុគិតលើ ១០ · មធ្យមភាគ = ផលបូក(ពិន្ទុ × មេគុណ) ÷ ផលបូកមេគុណ · A ≥ ៩, B ≥ ៨, C ≥ ៧, D ≥ ៦, E ≥ ៥, F &lt; ៥</p>`+docFooter()}},
 results:{n:'តារាងលទ្ធផលប្រឡង',o:'p',opts:['per'],build:o=>{
   const f=id=>o.per==='y'?yearAvg(id):avgOf(id,o.per);
   const rows=DB.students.map(s=>({s,a:f(s.id)})).sort((x,y)=>(y.a??-1)-(x.a??-1)),rk=rankMap(f);
   const have=rows.filter(r=>r.a!=null),pass=have.filter(r=>r.a>=5).length;
   return docHeader('តារាងលទ្ធផលប្រឡង '+(o.per==='y'?'ប្រចាំឆ្នាំ':colName(o.per)),clsSub())+`<table style="${TS}"><thead><tr>${TH('ចំណាត់ថ្នាក់')}${TH('គោត្តនាម និងនាម')}${TH('ភេទ')}${TH('មធ្យមភាគ')}${TH('និទ្ទេស')}${TH('លទ្ធផល')}${TH('កិត្តិយស')}</tr></thead><tbody>

  bind1('#xc','col');bind1('#xp','per');bind1('#xm','month');bind1('#xs','stu');bind1('#xj','subj');
  const pap=$('#paper'),wrap=$('.paperwrap');let zoomed=false;

}};
function copyDoc(){

  try{
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})])
      .then(()=>toast('បានចម្លង · បិទភ្ជាប់ក្នុង Word ឬ Excel'),sel);

      <td class="c num">${fx(withClass(r.c,()=>yearAvg(r.s.id)))}</td><td>${esc(r.s.guardian||'—')}</td>
      <td><button class="btn sm" data-e="${r.s.id}" data-c="${r.c.id}">កែ</button> <button class="btn sm dng" data-d="${r.s.id}" data-c="${r.c.id}">លុប</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">មិនមានសិស្ស</td></tr>'}
    </tbody></table></div>${total>200?`<p style="color:var(--muted)">បង្ហាញ ២០០នាក់ដំបូង ពីសរុប ${kh(total)} · សូមស្វែងរក ឬជ្រើសថ្នាក់ដើម្បីមើលបន្ត។</p>`:''}</div>`;

    el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>ask('លុបសិស្សនេះ និងពិន្ទុរបស់គាត់?',()=>{
      const c=ROOT.classes.find(x=>x.id===b.dataset.c),id=b.dataset.d;c.students=c.students.filter(s=>s.id!==id);delete c.scores[id];Object.values(c.att).forEach(d=>delete d[id]);save();draw()}));
    el.querySelectorAll('[data-mv]').forEach(sel=>sel.onchange=()=>{
      const from=ROOT.classes.find(x=>x.id===sel.dataset.c),to=ROOT.classes.find(x=>x.id===sel.value),id=sel.dataset.mv;
      if(!to||from===to)return;

      Object.entries(from.att).forEach(([d,o])=>{if(o[id]){(to.att[d]??={})[id]=o[id];delete o[id]}});

<script>
/* ---------- admin: import students from a Google Sheet (paste cells or CSV file) ---------- */
const unKh=s=>String(s).replace(/[០-៩]/g,d=>KH.indexOf(d));
function sheetSection(txt){ /* whole-workbook export: keep only the Students (or first) section */
  txt=txt.replace(/^\uFEFF/,'');if(!/^## Sheet name:/.test(txt))return txt;
  const parts=txt.split(/^## Sheet name:[^\n]*\n/m).slice(1),names=[...txt.matchAll(/^## Sheet name:\s*(.*)$/gm)].map(m=>m[1].trim());
  let i=names.findIndex(n=>/^students?$|សិស្ស/i.test(n));if(i<0)i=0;return parts[i]||txt}
function parseTable(txt){
  txt=sheetSection(txt);
  const first=txt.split(/\r?\n/)[0]||'';
  const d=first.includes('\t')?'\t':(first.includes(',')?',':'\t');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const normSex=v=>{v=String(v||'').trim().toLowerCase();if(!v)return '';if(v.includes('ស្រី')||['ស','f','female','girl','woman'].includes(v))return 'ស្រី';if(v.includes('ប្រុស')||['ប','m','male','boy','man'].includes(v))return 'ប្រុស';return ''};
function normDob(v){
  v=unKh(v||'').trim();const m=v.match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/);if(!m)return '';
  let y,mo,d;if(m[1].length===4){y=+m[1];mo=+m[2];d=+m[3]}else{d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=y>50?1900:2000}
  if(mo<1||mo>12||d<1||d>31||y<1950)return '';
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
const clsKey=s=>unKh(String(s||'')).toLowerCase().replace(/\s+/g,'').replace(/^ថ្នាក់(ទី)?/,'').replace(/^class|^grade/,'');
const IMP_F=[['name','ឈ្មោះសិស្ស *',/ឈ្មោះ|គោត្តនាម|name/i],['name2','នាម (បន្ថែម បើបែងជាពីរជួរ)',null],['sex','ភេទ',/ភេទ|sex|gender/i],['dob','ថ្ងៃខែឆ្នាំកំណើត',/កំណើត|birth|dob/i],
  ['guardian','អាណាព្យាបាល',/អាណាព្យាបាល|ឪពុក|ម្តាយ|guardian|parent/i],['phone','ទូរស័ព្ទ',/ទូរស័ព្ទ|phone|tel/i],['cls','ថ្នាក់ (បើមានក្នុងតារាង)',/ថ្នាក់|class|grade/i],['w','ទម្ងន់ (kg)',/ទម្ងន់|weight/i],['h','កម្ពស់ (cm)',/កម្ពស់|height/i]];
let IMP={text:'',hdr:true,map:{},cls:'',mode:'add',done:null};
V.import={title:'នាំចូលទិន្នន័យសិស្ស',render(el){
    el.innerHTML=`<div class="page"><div class="ph"><h2>📥 នាំចូលសិស្សពី Google Sheet</h2></div>
    <div class="card" style="margin-bottom:14px"><h3>១. យកទិន្នន័យពី Google Sheet</h3>
      <ol style="margin:0 0 10px;padding-left:20px;color:var(--muted)"><li>បើក Google Sheet ជ្រើសរើសក្រឡាទាំងអស់ (រួមទាំងជួរក្បាលតារាង) ចុច Ctrl+C ហើយបិទភ្ជាប់ខាងក្រោម</li>
      <li>ឬ ឯកសារ → ទាញយក → តម្លៃដែលបំបែកដោយក្បៀស (.csv) រួចជ្រើសឯកសារនោះ</li></ol>
      <textarea class="in" id="imt" style="min-height:130px" placeholder="បិទភ្ជាប់ទិន្នន័យនៅទីនេះ…" aria-label="ទិន្នន័យពី Google Sheet">${esc(IMP.text)}</textarea>
      <div class="row" style="margin:8px 0"><input class="in" id="iml" placeholder="តំណ Google Sheet (https://docs.google.com/spreadsheets/d/…)" style="flex:1;min-width:200px" aria-label="តំណ Google Sheet"><button class="btn pri" id="imlg">🔗 ទាញពីតំណ</button></div><div id="imlm" style="font-size:13px;color:var(--muted)"></div>
      <div class="row" style="margin-top:8px"><label class="btn" style="margin:0">ជ្រើសឯកសារ .csv<input type="file" id="imf" accept=".csv,.tsv,.txt" hidden></label>
      <label class="row" style="gap:6px"><input type="checkbox" id="imh" ${IMP.hdr?'checked':''} style="width:20px;height:20px"> ជួរទីមួយជាក្បាលតារាង</label><button class="btn sm" id="imc">សម្អាត</button></div></div>
    <div id="imrest"></div></div>`;
    let tm=0;
    const t=$('#imt');t.oninput=()=>{IMP.text=t.value;IMP.map={};IMP.done=null;clearTimeout(tm);tm=setTimeout(draw,350)};
    $('#imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{IMP.text=String(r.result);t.value=IMP.text;IMP.map={};IMP.done=null;draw()};r.readAsText(f)};
    $('#imlg').onclick=async()=>{
      const u=$('#iml').value.trim(),m=u.match(/\/d\/(?:e\/)?([\w-]+)/),g=u.match(/[#?&]gid=(\d+)/),msg=$('#imlm');
      if(!m){msg.textContent='តំណមិនត្រឹមត្រូវ';return}
      msg.textContent='កំពុងទាញ…';
      const url=u.includes('/pub')?u.replace(/\/pub(html)?.*$/,'/pub?output=csv'+(g?'&gid='+g[1]:'')):`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g?'&gid='+g[1]:''}`;
      try{
        const r=await fetch(url);if(!r.ok)throw new Error(r.status);
        const tx=await r.text();if(/<html/i.test(tx.slice(0,300)))throw new Error('private');
        IMP.text=tx;t.value=tx;IMP.map={};IMP.done=null;msg.textContent='✅ ទាញបាន '+kh(tx.split('\n').length)+' ជួរ';draw();
      }catch(e){
        msg.innerHTML='❌ ទាញមិនបាន។ មូលហេតុអាចជា៖ (១) Sheet មិនបានចែករំលែក “អ្នកណាមានតំណក៏មើលបាន” (២) កំពុងបើកក្នុង Claude artifact ដែលបិទការហៅអ៊ីនធឺណិតខាងក្រៅ — សូមប្រើឯកសារ HTML ដែលដាក់លើ hosting ឬ Copy ទិន្នន័យបិទភ្ជាប់ក្នុងប្រអប់ខាងលើ។'}
    };
    $('#imh').onchange=e=>{IMP.hdr=e.target.checked;IMP.map={};draw()};
    $('#imc').onclick=()=>{IMP.text='';t.value='';IMP.map={};IMP.done=null;draw()};
  const draw=()=>{
    const rows=IMP.text.trim()?parseTable(IMP.text):[];
    const hdr=IMP.hdr&&rows.length?rows[0]:null,body=hdr?rows.slice(1):rows,ncol=rows.reduce((a,r)=>Math.max(a,r.length),0);
    const colNames=Array.from({length:ncol},(_,i)=>hdr&&hdr[i]?.trim()?hdr[i].trim():'ជួរ '+(i+1));
    if(rows.length&&!Object.keys(IMP.map).length){IMP_F.forEach(f=>{if(!f[2])return;const i=colNames.findIndex(n=>f[2].test(n)&&!(f[0]==='name'&&/\bid\b|លេខ|code|file/i.test(n)));if(i>=0)IMP.map[f[0]]=i})}
    const M=IMP.map,raw=(r,k)=>M[k]===undefined||M[k]===''?'':String(r[M[k]]??'').trim();
    const FB={phone:[/ទូរស.?ព្ទឪពុក|father.*(phone|tel)/i,/ទូរស.?ព្ទម្តាយ|mother.*(phone|tel)/i,/ទូរស.?ព្ទអាណាព្យាបាល|guardian.*(phone|tel)/i],guardian:[/^ឈ្មោះអាណាព្យាបាល|^guardian/i,/^ឈ្មោះម្តាយ|^mother/i]};
    const get=(r,k)=>{let v=raw(r,k);if(v||!FB[k])return v;for(const re of FB[k]){const i=colNames.findIndex(n=>re.test(n));if(i>=0&&String(r[i]??'').trim())return String(r[i]).trim()}return ''};
    const nm=r=>(get(r,'name')+' '+get(r,'name2')).trim();
    const valid=body.filter(r=>nm(r));
    const noSex=valid.filter(r=>!normSex(get(r,'sex'))).length;
    $('#imrest').innerHTML=`${rows.length?`<div class="card" style="margin-bottom:14px"><h3>២. ផ្គូផ្គងជួរ (ឃើញ ${kh(body.length)} ជួរទិន្នន័យ)</h3><div class="grid g2" style="gap:8px 14px">
      ${IMP_F.map(f=>`<div><label class="f" for="im-${f[0]}" style="margin-top:0">${f[1]}</label><select class="in" id="im-${f[0]}" data-m="${f[0]}"><option value="">— មិនប្រើ —</option>${colNames.map((n,i)=>`<option value="${i}" ${M[f[0]]===i?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`).join('')}</div>
      ${M.cls===undefined?`<label class="f" for="imc2">ដាក់ចូលថ្នាក់</label><select class="in" id="imc2" style="max-width:260px">${ROOT.classes.map(c=>`<option value="${c.id}" ${IMP.cls===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:'<p style="color:var(--muted);margin:10px 0 0">ថ្នាក់ថ្មីដែលមិនទាន់មាន នឹងត្រូវបង្កើតដោយស្វ័យប្រវត្តិ ហើយនៅលាក់ពីគ្រូរហូតដល់អ្នកបង្ហាញ។</p>'}
      <label class="f" for="imm">របៀបនាំចូល</label><select class="in" id="imm" style="max-width:360px"><option value="add" ${IMP.mode==='add'?'selected':''}>បន្ថែម (រំលងឈ្មោះដែលមានស្រាប់ក្នុងថ្នាក់)</option><option value="replace" ${IMP.mode==='replace'?'selected':''}>ជំនួសសិស្សទាំងអស់ក្នុងថ្នាក់ដែលពាក់ព័ន្ធ</option>${M.cls!==undefined?`<option value="fresh" ${IMP.mode==='fresh'?'selected':''}>ចាប់ផ្តើមថ្មី៖ លុបថ្នាក់ និងសិស្សទាំងអស់ (ទាំងទិន្នន័យគំរូ) រួចនាំចូល</option>`:''}</select></div>
    <div class="card" style="margin-bottom:14px"><h3>៣. មើលជាមុន</h3>
      ${M.name===undefined?'<div class="err">សូមជ្រើសជួរ “ឈ្មោះសិស្ស”</div>':`<p style="margin:0 0 8px">ត្រឹមត្រូវ <b>${kh(valid.length)}</b> នាក់${body.length-valid.length?` · គ្មានឈ្មោះ ${kh(body.length-valid.length)} ជួរ (រំលង)`:''}${noSex?` · <span style="color:var(--warn)">ភេទមិនស្គាល់ ${kh(noSex)} នាក់</span>`:''}</p>
      <div class="tw"><table><thead><tr><th>ឈ្មោះ</th><th>ភេទ</th><th>កំណើត</th><th>អាណាព្យាបាល</th><th>ទូរស័ព្ទ</th><th>ថ្នាក់</th></tr></thead><tbody>${valid.slice(0,6).map(r=>`<tr><td>${esc(nm(r))}</td><td>${esc(normSex(get(r,'sex'))||'?')}</td><td>${esc(normDob(get(r,'dob'))||'—')}</td><td>${esc(get(r,'guardian')||'—')}</td><td>${esc(unKh(get(r,'phone'))||'—')}</td><td>${esc(M.cls!==undefined?get(r,'cls')||'?':(ROOT.classes.find(c=>c.id===IMP.cls)?.name||''))}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn pri" id="imgo" style="margin-top:12px" ${valid.length?'':'disabled'}>នាំចូល ${kh(valid.length)} នាក់</button>`}</div>`:''}
    ${IMP.done?`<div class="card" style="border-color:var(--accent)"><h3>✅ នាំចូលរួចរាល់</h3><p style="margin:0">បន្ថែម <b>${kh(IMP.done.added)}</b> នាក់ · រំលង (ស្ទួន) <b>${kh(IMP.done.dup)}</b> · ថ្នាក់ថ្មី <b>${kh(IMP.done.newCls)}</b></p>
      <p style="color:var(--muted)">គ្រូនឹងឃើញទិន្នន័យ នៅពេលអ្នកបើក “បង្ហាញដល់គ្រូ” ក្នុងគ្រប់គ្រងថ្នាក់រៀន។</p><button class="btn pri" id="imto">ទៅគ្រប់គ្រងថ្នាក់រៀន</button></div>`:''}`;
    el.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>{if(s.value==='')delete IMP.map[s.dataset.m];else IMP.map[s.dataset.m]=+s.value;draw()});
    const c2=$('#imc2');if(c2){IMP.cls=c2.value;c2.onchange=()=>{IMP.cls=c2.value;draw()}}else if(!IMP.cls)IMP.cls=ROOT.classes[0].id;
    const im=$('#imm');if(im)im.onchange=()=>{IMP.mode=im.value};
    const go2=$('#imto');if(go2)go2.onclick=()=>go('classes');
    const run=$('#imgo');
    if(run)run.onclick=()=>{
      let targets=new Set();let newCls=0;
      const classFor=r=>{
        if(M.cls===undefined)return ROOT.classes.find(c=>c.id===IMP.cls)||ROOT.classes[0];
        const raw=get(r,'cls');if(!raw)return null;const k=clsKey(raw);
        let c=ROOT.classes.find(x=>clsKey(x.name)===k);
        if(!c){c=emptyClass(raw.startsWith('ថ្នាក់')?raw:'ថ្នាក់ '+raw,'');c.published=false;ROOT.classes.push(c);newCls++}
        return c};
      let plan=[];
      const apply=()=>{
        if(IMP.mode==='fresh'&&M.cls!==undefined){ROOT.classes=[];}
        plan=valid.map(r=>({r,c:classFor(r)}));plan.forEach(p=>p.c&&targets.add(p.c));
        if(IMP.mode==='replace')targets.forEach(c=>{c.students.forEach(s=>{delete c.scores[s.id];Object.values(c.att).forEach(d=>delete d[s.id])});c.students=[]});
        let added=0,dup=0;const seen=n=>n.replace(/\s+/g,' ').trim();
        plan.forEach(({r,c})=>{
          if(!c){dup++;return}
          const name=seen(nm(r));if(c.students.some(s=>seen(s.name)===name)){dup++;return}
          const w=parseFloat(unKh(get(r,'w'))),h=parseFloat(unKh(get(r,'h')));
          c.students.push({id:uid(),name,sex:normSex(get(r,'sex')),dob:normDob(get(r,'dob')),guardian:get(r,'guardian'),phone:unKh(get(r,'phone')),w:isNaN(w)?null:w,h:isNaN(h)?null:h});added++});
        if(!ROOT.classes.length)ROOT.classes.push(emptyClass('ថ្នាក់ទី ១',''));VIEWCLASS=null;RO=false;bind(ROOT.classes[0].id);save();IMP.done={added,dup,newCls};IMP.text='';$('#imt').value='';IMP.map={};draw();
      };
      if(IMP.mode==='fresh'&&M.cls!==undefined)ask('លុបថ្នាក់ សិស្ស ពិន្ទុ និងវត្តមានទាំងអស់ដែលមានស្រាប់ រួចនាំចូលថ្មី? មិនអាចត្រឡប់វិញបានទេ (គួរបម្រុងទុកជាមុនក្នុងការកំណត់សាលា)។',apply);
      else if(IMP.mode==='replace')ask('ជំនួសសិស្សទាំងអស់ក្នុងថ្នាក់ដែលពាក់ព័ន្ធ ព្រមទាំងលុបពិន្ទុ និងវត្តមានរបស់ពួកគេ?',apply);else apply();
    };
  };draw();
}};
</script>
<script>
/* ---------- subject teachers, students, guardians ---------- */
let SUBJT=null,ME=null;
function pinOf(s,k){
  const custom=k==='S'?s.pinS:s.pinG;if(custom)return String(custom);
  const d=unKh(s.phone||'').replace(/\D/g,'');
  return k==='S'?(d.length>=4?d.slice(-4):'1234'):(d.length>=6?d.slice(-6):'123456');
}
const subjOf=(c,t)=>c.subjects.find(b=>b.name.trim()===String(t.subject||'').trim());

/* --- subject teacher --- */
let ssClass=null,ssCol=null;
V.sdash={title:'ថ្នាក់ដែលខ្ញុំបង្រៀន',render(el){
  const t=SUBJT,rows=ROOT.classes.filter(c=>c.published!==false).map(c=>{
    const b=subjOf(c,t);if(!b)return null;
    const vals=[];let lastCol=null;
    for(let i=MONTHS.length-1;i>=0&&!vals.length;i--){c.students.forEach(s=>{const v=c.scores[s.id]?.[b.id]?.['m'+i];if(v!==undefined&&v!=='')vals.push(+v)});if(vals.length)lastCol=i}
    const entered=c.students.filter(s=>c.scores[s.id]?.[b.id]&&Object.keys(c.scores[s.id][b.id]).length).length;
    return {c,b,avg:vals.length?mean(vals):null,lastCol,entered};
  }).filter(Boolean);
  el.innerHTML=`<div class="page"><div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface))"><h2 style="font-size:18px">សួស្តី ${esc(t.name)} 👋</h2>
    <div style="color:var(--muted)">មុខវិជ្ជាបង្រៀន៖ <b>${esc(t.subject||'មិនទាន់កំណត់')}</b> · ${esc(ROOT.settings.school)}</div></div>
  ${!t.subject?'<div class="card empty">គណៈគ្រប់គ្រងមិនទាន់កំណត់មុខវិជ្ជាបង្រៀនរបស់អ្នកទេ។</div>':rows.length?`<div class="tw"><table><thead><tr><th>ថ្នាក់</th><th>គ្រូបន្ទុក</th><th class="c">សិស្ស</th><th class="c">មានពិន្ទុ</th><th class="c">មធ្យមភាគ${''}</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.c.name)}</b></td><td>${esc(r.c.teacher||'—')}</td><td class="c num">${kh(r.c.students.length)}</td><td class="c num">${kh(r.entered)}/${kh(r.c.students.length)}</td><td class="c num">${r.avg==null?'—':fx(r.avg)}${r.lastCol!=null?` <small>(ខែ${MONTHS[r.lastCol]})</small>`:''}</td><td><button class="btn sm pri" data-o="${r.c.id}">បញ្ចូលពិន្ទុ</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">មិនមានថ្នាក់ណាមានមុខវិជ្ជា “'+esc(t.subject)+'” ទេ។ សូមឱ្យគណៈគ្រប់គ្រងពិនិត្យឈ្មោះមុខវិជ្ជា។</div>'}</div>`;
  el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ssClass=b.dataset.o;go('ssheet')});
}};
V.ssheet={title:'បញ្ចូលពិន្ទុមុខវិជ្ជា',render(el){
  const t=SUBJT,cls=ROOT.classes.filter(c=>c.published!==false&&subjOf(c,t));
  if(!cls.length){el.innerHTML='<div class="page"><div class="card empty">មិនមានថ្នាក់សម្រាប់មុខវិជ្ជារបស់អ្នកទេ។</div></div>';return}
  if(!cls.some(c=>c.id===ssClass))ssClass=cls[0].id;
  const draw=()=>{
    const c=cls.find(x=>x.id===ssClass),b=subjOf(c,t);
    if(!ssCol)ssCol='m0';
    const stu=[...c.students].sort((x,y)=>x.name.localeCompare(y.name,'km'));
    const vals=stu.map(s=>c.scores[s.id]?.[b.id]?.[ssCol]).filter(v=>v!==undefined&&v!=='').map(Number);
    el.innerHTML=`<div class="page"><div class="ph"><h2>📝 ${esc(b.name)}</h2></div>
    <div class="row" style="margin-bottom:12px"><select class="in" id="sc" style="max-width:240px" aria-label="ថ្នាក់">${cls.map(x=>`<option value="${x.id}" ${x.id===ssClass?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <select class="in" id="sp" style="max-width:200px" aria-label="រយៈពេល">${COLS.map(x=>`<option value="${x.k}" ${x.k===ssCol?'selected':''}>${x.n}</option>`).join('')}</select><span class="pill blue">មេគុណ ${kh(b.coef)}</span></div>
    <div class="tw"><table><thead><tr><th class="c">ល.រ</th><th>គោត្តនាម និងនាម</th><th class="c">ភេទ</th><th class="c">ពិន្ទុ (០–១០)</th><th>និទ្ទេស</th></tr></thead><tbody>
    ${stu.map((s,i)=>{const v=c.scores[s.id]?.[b.id]?.[ssCol];return `<tr data-id="${s.id}"><td class="c num">${kh(i+1)}</td><td>${esc(s.name)}</td><td class="c">${esc(s.sex)}</td>
      <td class="c"><input class="in cell" inputmode="decimal" value="${v??''}" aria-label="ពិន្ទុ"></td><td data-g>${v===undefined||v===''?'—':gpill(+v)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">ថ្នាក់នេះមិនទាន់មានសិស្ស</td></tr>'}</tbody></table></div>
    <p id="ssum" style="color:var(--muted)">បានបញ្ចូល ${kh(vals.length)}/${kh(stu.length)} · មធ្យមភាគថ្នាក់ ${vals.length?fx(mean(vals)):'—'}</p></div>`;
    $('#sc').onchange=e=>{ssClass=e.target.value;draw()};$('#sp').onchange=e=>{ssCol=e.target.value;draw()};
    el.querySelectorAll('tr[data-id] input').forEach(inp=>inp.onchange=()=>{
      const tr=inp.closest('tr'),sid=tr.dataset.id,v=inp.value.trim().replace(',','.');
      if(v===''){if(c.scores[sid]?.[b.id])delete c.scores[sid][b.id][ssCol]}
      else{let n=parseFloat(v);if(isNaN(n)){inp.value='';return}n=Math.min(10,Math.max(0,n));inp.value=n;((c.scores[sid]??={})[b.id]??={})[ssCol]=n}
      save();const x=c.scores[sid]?.[b.id]?.[ssCol];tr.querySelector('[data-g]').innerHTML=x===undefined?'—':gpill(+x);
      const vs=stu.map(s=>c.scores[s.id]?.[b.id]?.[ssCol]).filter(q=>q!==undefined&&q!=='').map(Number);
      $('#ssum').textContent=`បានបញ្ចូល ${kh(vs.length)}/${kh(stu.length)} · មធ្យមភាគថ្នាក់ ${vs.length?fx(mean(vs)):'—'}`});
  };draw();
}};

/* --- student / guardian (read-only, own data only) --- */
function meCtx(){
  const c=ROOT.classes.find(x=>x.id===ME?.cid),s=c?.students.find(x=>x.id===ME?.sid);
  return {c,s};
}
const whoS=()=>ROLE==='guardian'?'កូនរបស់អ្នក':'អ្នក';
function noMe(el){el.innerHTML='<div class="page"><div class="card empty">រកមិនឃើញទិន្នន័យ។ សូមចាកចេញ ហើយចូលម្តងទៀត។</div></div>'}
V.mdash={title:'ផ្ទាំងសង្ខេប',render(el){
  const {c,s}=meCtx();if(!s)return noMe(el);
  const d=withClass(c,()=>{
    const lm=latestMonth(),a=lm<0?null:avgOf(s.id,'m'+lm),rk=lm<0?{}:rankMap(id=>avgOf(id,'m'+lm)),ya=yearAvg(s.id);
    let p=0,l=0,ab=0;Object.values(c.att).forEach(o=>{const v=o[s.id];if(v==='P')p++;else if(v==='L')l++;else if(v==='A')ab++});
    const subj=DB.subjects.map(b=>{const o=c.scores[s.id]?.[b.id]||{};const v=o['m'+lm];return {n:b.name,v:v===undefined?null:+v}}).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v);
    return {lm,a,r:rk[s.id],n:Object.keys(rk).length,ya,p,l,ab,months:MONTHS.map((_,i)=>avgOf(s.id,'m'+i)),subj};
  });
  const b=bmi(s),bs=bmiState(b),tot=d.p+d.l+d.ab;
  el.innerHTML=`<div class="page"><div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,var(--blue-soft),var(--surface))">
    <h2 style="font-size:18px">${ROLE==='guardian'?'សួស្តី អាណាព្យាបាលរបស់ ':'សួស្តី '}${esc(s.name)} 👋</h2>
    <div style="color:var(--muted)">${esc(ROOT.settings.school)} · ${esc(c.name)} · គ្រូបន្ទុក ${esc(c.teacher||'—')}</div></div>
  <div class="grid g4">
    <div class="card stat"><div class="k">មធ្យមភាគ${d.lm>=0?' ខែ'+MONTHS[d.lm]:''}</div><div class="v num">${d.a==null?'—':fx(d.a)}</div><div class="s">${d.a==null?'មិនទាន់មានពិន្ទុ':grade(d.a)[1]+' · '+grade(d.a)[2]}</div></div>
    <div class="card stat"><div class="k">ចំណាត់ថ្នាក់ក្នុងថ្នាក់</div><div class="v num">${d.r?kh(d.r):'—'}</div><div class="s">${d.r?'ក្នុងចំណោម '+kh(d.n)+' នាក់':''}</div></div>
    <div class="card stat"><div class="k">មធ្យមភាគឆ្នាំ</div><div class="v num">${d.ya==null?'—':fx(d.ya)}</div><div class="s">${d.ya==null?'':d.ya>=5?'ជាប់':'ត្រូវខិតខំបន្ថែម'}</div></div>
    <div class="card stat"><div class="k">វត្តមាន</div><div class="v num">${tot?fx((d.p+d.l)/tot*100,0)+'%':'—'}</div><div class="s">អវត្តមាន ${kh(d.ab)} ថ្ងៃ · ច្បាប់ ${kh(d.l)}</div></div></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>មធ្យមភាគប្រចាំខែ</h3>${barChart(MONTHS,d.months)}</div>

{k:'card',n:'🧾 ព្រឹត្តិបត្រពិន្ទុ',o:'p',ctl(){
  return `<select class="in" id="rsid" style="max-width:240px" aria-label="សិស្ស"><option value="all">សិស្សទាំងអស់ (ម្នាក់ ១ទំព័រ)</option>${sorted().map(s=>`<option value="${s.id}" ${s.id===RS.sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select>${perSel()}`},
 doc(){
  const col=RS.col,rk=rankMap(id=>pAvg(id,col)),n=Object.keys(rk).length;
  const list=RS.sid==='all'?sorted():sorted().filter(s=>s.id===RS.sid);if(!list.length)return nostu;
  return list.map((s,i)=>{const a=pAvg(s.id,col);
   return `<div ${i<list.length-1?'style="page-break-after:always"':''}>`+docHeader('ព្រឹត្តិបត្រពិន្ទុ',perName(col)+' · '+clsSub())+
   `<table style="width:100%;font-size:13px;margin:6px 0;color:#000"><tr><td>ឈ្មោះសិស្ស៖ <b>${esc(s.name)}</b></td><td>ភេទ៖ ${esc(s.sex)}</td><td>ថ្នាក់៖ ${esc(CUR.name)}</td></tr></table>`+
   tbl(['ល.រ','មុខវិជ្ជា','មេគុណ','ពិន្ទុ (/១០)','និទ្ទេស'].map(h=>TH(h)),DB.subjects.map((b,j)=>{const v=subVal(s.id,b,col);return `<tr>${TC(kh(j+1),'center')}${TC(esc(b.name))}${TC(kh(b.coef),'center')}${TC(v==null?'':fx(v,1),'center')}${TC(v==null?'':grade(v)[1],'center')}</tr>`}).concat([`<tr>${TC('<b>មធ្យមភាគ</b>','center','" colspan="3')}${TC('<b>'+(a==null?'':fx(a))+'</b>','center')}${TC(a==null?'':'<b>'+grade(a)[1]+' · '+grade(a)[2]+'</b>','center')}</tr>`]))+
   `<p style="font-size:13px;color:#000">ចំណាត់ថ្នាក់ក្នុងថ្នាក់៖ <b>${rk[s.id]?kh(rk[s.id])+' / '+kh(n):'—'}</b> · អវត្តមាន <b>${kh(absentCount(s.id))}</b> ដង</p>
   <p style="font-size:13px;color:#000">ការផ្តល់យោបល់របស់គ្រូ៖ ${ed('rmk|'+s.id+'|'+col,'')}</p>`+docFooter()+'</div>'}).join('');
}},
{k:'trk',n:'📘 សៀវភៅតាមដានការសិក្សា',o:'l',doc(){

{k:'sp',n:'📋 ផែនការសិក្សារបស់សិស្ស',o:'p',ctl(){return `<select class="in" id="rsid1" style="max-width:260px" aria-label="សិស្ស">${sorted().map(s=>`<option value="${s.id}" ${s.id===RS.sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`},
 doc(){
  const s=DB.students.find(x=>x.id===RS.sid);if(!s)return nostu;
  const sub=DB.subjects.map(b=>({b,v:subYear(s.id,b)})).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v);
  const strong=sub.slice(0,2).filter(x=>x.v>=6).map(x=>x.b.name).join(' · '),weak=sub.filter(x=>x.v<6).map(x=>x.b.name).join(' · ');
  const y=yearAvg(s.id),id='sp|'+s.id+'|';
  return docHeader('ផែនការសិក្សារបស់សិស្ស',clsSub())+
  `<table style="width:100%;font-size:13px;color:#000;line-height:1.9"><tr><td>ឈ្មោះសិស្ស៖ <b>${esc(s.name)}</b></td><td>ភេទ៖ ${esc(s.sex)}</td><td>អាយុ៖ ${ageOf(s)==null?'—':kh(ageOf(s))} ឆ្នាំ</td></tr>
  <tr><td colspan="3">មធ្យមភាគឆ្នាំ៖ <b>${y==null?'—':fx(y)}</b> (${y==null?'—':gl(y)}) · អវត្តមាន <b>${kh(absentCount(s.id))}</b> ដង</td></tr>
  <tr><td colspan="3">មុខវិជ្ជាខ្លាំង៖ ${ed(id+'str',strong)}</td></tr><tr><td colspan="3">មុខវិជ្ជាត្រូវពង្រឹង៖ ${ed(id+'weak',weak)}</td></tr>
  <tr><td colspan="3">គោលដៅសិក្សា (មធ្យមភាគ)៖ ${ed(id+'goal','')}</td></tr></table>`+
  tbl(['ល.រ','សកម្មភាពអនុវត្ត','រយៈពេល','អ្នកជួយ/គាំទ្រ','លទ្ធផលរំពឹង'].map(h=>TH(h)),[0,1,2,3,4].map(i=>`<tr>${TC(kh(i+1),'center')}${[0,1,2,3].map(j=>TC(ed(id+i+'|'+j,''))).join('')}</tr>`))+
  `<p style="font-size:13px;color:#000">ការប្តេជ្ញារបស់សិស្ស៖ ${ed(id+'pledge','')}</p>
  <table style="width:100%;margin-top:14px;text-align:center;font-size:12.5px;color:#000"><tr><td>សិស្ស<div style="height:50px"></div>${esc(s.name)}</td><td>អាណាព្យាបាល<div style="height:50px"></div>${esc(s.guardian||'')}</td><td>គ្រូបន្ទុកថ្នាក់<div style="height:50px"></div>${esc(CUR.teacher||'')}</td></tr></table>`;
}},

{k:'ext',n:'📝 សម្រង់ពិន្ទុតាមនិទ្ទេស',o:'p',ctl(){
  return `<select class="in" id="rsj" style="max-width:200px" aria-label="មុខវិជ្ជា">${DB.subjects.map(b=>`<option value="${b.id}" ${b.id===RS.subj?'selected':''}>${esc(b.name)}</option>`).join('')}</select>${perSel()}
  <select class="in" id="rgr" style="max-width:150px" aria-label="និទ្ទេស"><option value="all">និទ្ទេសទាំងអស់</option>${GR.map(g=>`<option value="${g[1]}" ${g[1]===RS.grade?'selected':''}>និទ្ទេស ${g[1]}</option>`).join('')}</select>`},
 doc(){
  const b=DB.subjects.find(x=>x.id===RS.subj);if(!b)return nostu;
  const L=DB.students.map(s=>({s,v:subVal(s.id,b,RS.col)})).filter(x=>x.v!=null).sort((x,y)=>y.v-x.v);
  const F=RS.grade==='all'?L:L.filter(x=>grade(x.v)[1]===RS.grade);
  return docHeader('សម្រង់ពិន្ទុមាននិទ្ទេសតាមមុខវិជ្ជា',esc(b.name)+' · '+perName(RS.col)+' · '+clsSub())+
  tbl(['ល.រ','គោត្តនាម និងនាម','ភេទ','ពិន្ទុ','និទ្ទេស'].map(h=>TH(h)),F.length?F.map((x,i)=>`<tr>${TC(kh(i+1),'center')}${TC(esc(x.s.name))}${TC(esc(x.s.sex),'center')}${TC(fx(x.v,1),'center')}${TC(gl(x.v),'center')}</tr>`):[`<tr><td colspan="5" style="${TD};text-align:center">មិនមានទិន្នន័យ</td></tr>`])+
  `<p style="font-size:12.5px;color:#000">សរុប៖ ${GR.map(g=>g[1]+' = '+kh(L.filter(x=>grade(x.v)[1]===g[1]).length)).join(' · ')} · មធ្យមភាគថ្នាក់ ${L.length?fx(mean(L.map(x=>x.v))):'—'}</p>`+docFooter();
}}
];
function perSel(){return `<select class="in" id="rpc" style="max-width:170px" aria-label="រយៈពេល">${COLS.map(c=>`<option value="${c.k}" ${c.k===RS.col?'selected':''}>${c.n}</option>`).join('')}<option value="y" ${RS.col==='y'?'selected':''}>ប្រចាំឆ្នាំ</option></select>`}

function overview(){
  const S=DB.students,lm=latestMonth(),f=S.filter(s=>s.sex==='ស្រី').length,ya=S.map(s=>yearAvg(s.id)).filter(x=>x!=null),
   la=lm<0?[]:S.map(s=>avgOf(s.id,'m'+lm)).filter(x=>x!=null),ar=attRate(),risk=atRisk();
  const dist=GR.map((g,i)=>({label:g[1]+' '+g[2],value:ya.filter(v=>grade(v)[1]===g[1]).length,color:GCOL[i]}));
  const top=S.map(s=>({s,a:yearAvg(s.id)})).filter(x=>x.a!=null).sort((x,y)=>y.a-x.a).slice(0,5);
  return `<div class="grid g4"><div class="card stat"><div class="k">សិស្សសរុប</div><div class="v num">${kh(S.length)}</div><div class="s">ស្រី ${kh(f)} · ប្រុស ${kh(S.length-f)}</div></div>
  <div class="card stat"><div class="k">មធ្យមភាគថ្នាក់${lm>=0?' ខែ'+MONTHS[lm]:''}</div><div class="v num">${la.length?fx(mean(la)):'—'}</div><div class="s">${la.length?gl(mean(la)):''}</div></div>
  <div class="card stat"><div class="k">អត្រាជាប់ (មធ្យមភាគឆ្នាំ ≥៥)</div><div class="v num">${ya.length?fx(ya.filter(v=>v>=5).length/ya.length*100,0)+'%':'—'}</div><div class="s">${kh(ya.filter(v=>v>=5).length)}/${kh(ya.length)} នាក់</div></div>
  <div class="card stat"><div class="k">អត្រាវត្តមាន</div><div class="v num">${ar==null?'—':fx(ar,0)+'%'}</div><div class="s">សិស្សប្រឈមហានិភ័យ ${kh(risk.length)} នាក់</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>មធ្យមភាគថ្នាក់ប្រចាំខែ</h3>${barChart(MONTHS,MONTHS.map((_,i)=>{const a=S.map(s=>avgOf(s.id,'m'+i)).filter(x=>x!=null);return a.length?mean(a):null}))}</div>
  <div class="card"><h3>ការបែងចែកនិទ្ទេស (ឆ្នាំ)</h3><div class="row" style="flex-wrap:nowrap;gap:14px">${donut(dist)}<div>${dist.map(d=>`<div style="font-size:13px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${d.color}"></span> ${d.label} · <b>${kh(d.value)}</b></div>`).join('')}</div></div></div>
  <div class="card"><h3>🏆 សិស្សពូកែ ៥ នាក់ដំបូង</h3>${top.map((x,i)=>`<div style="padding:5px 0;border-bottom:1px solid var(--line)">${kh(i+1)}. ${esc(x.s.name)} <b class="num" style="float:right">${fx(x.a)}</b></div>`).join('')||'<div class="empty">មិនទាន់មានពិន្ទុ</div>'}</div>
  <div class="card"><h3>⚠ សិស្សត្រូវការជំនួយ</h3>${risk.slice(0,6).map(x=>`<div style="padding:5px 0;border-bottom:1px solid var(--line)">${esc(x.s.name)} <small style="color:var(--muted)">${x.why.join(' · ')}</small></div>`).join('')||'<div class="empty">មិនមាន</div>'}</div></div>`;
}

V.reports={title:'របាយការណ៍ និង ផែនការ',render(el){
  const lm=latestMonth();
  if(!RS.col)RS.col=lm>=0?'m'+lm:'m0';
  if(!DB.subjects.some(b=>b.id===RS.subj))RS.subj=DB.subjects[0]?.id;
  if(RS.k==='sp'&&(RS.sid==='all'||!DB.students.some(s=>s.id===RS.sid)))RS.sid=sorted()[0]?.id;
  if(RS.k==='card'&&RS.sid!=='all'&&!DB.students.some(s=>s.id===RS.sid))RS.sid='all';
  const sec=SEC.find(x=>x.k===RS.k)||SEC[0];
  el.innerHTML=`<div class="page"><div class="ph noprint"><h2>📊 របាយការណ៍ និង ផែនការ</h2></div>
  <div class="tabs noprint">${SEC.map(x=>`<button data-k="${x.k}" class="${x.k===sec.k?'on':''}">${x.n}</button>`).join('')}</div>
  ${sec.k==='ov'?overview():`<div class="row noprint" style="margin-bottom:12px">${sec.ctl?sec.ctl():''}<button class="btn pri" id="rcopy">📋 ចម្លងទៅ Word / Excel</button><button class="btn" id="rprint">🖨 បោះពុម្ព</button></div>
  <div class="paperwrap"><div class="paper ${sec.o}" id="paper">${sec.doc()}</div></div>
  <p class="noprint" style="color:var(--muted);font-size:13px">ប្រអប់ពណ៌លឿងអាចចុចសរសេរបានដោយផ្ទាល់ ហើយរក្សាទុកស្វ័យប្រវត្តិ។ ចម្លងទៅ Word/Excel ឬបោះពុម្ពទំហំ A4។</p>`}</div>`;
  const redo=()=>V.reports.render(el);
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{RS.k=b.dataset.k;if(RS.k==='card')RS.sid='all';redo()});
  if(sec.k==='ov')return;
  const on=(id,fn)=>{const e=$(id);if(e)e.onchange=()=>{fn(e);redo()}};
  on('#rsid',e=>RS.sid=e.value);on('#rsid1',e=>RS.sid=e.value);on('#rpc',e=>RS.col=e.value);on('#rsj',e=>RS.subj=e.value);on('#rgr',e=>RS.grade=e.value);on('#rpt',e=>RS.pt=e.value);
  const R=REP();
  const a=$('#rpadd');if(a)a.onclick=()=>{const t=RS.pt;R.planN??={};R.planN[t]=(R.planN[t]??Math.max(6,PLANS[t][1].length))+1;save();redo()};
  const tp=$('#rptpl');if(tp)tp.onclick=()=>{const t=RS.pt;PLANS[t][1].forEach((r,i)=>r.forEach((v,j)=>setp(R,'plan|'+t+'|r'+i+'|'+j,v)));save();redo()};
  const dp=$('#rdp');if(dp)dp.onchange=()=>{if(dp.value){(R.drop??={})[dp.value]={};save();redo()}};
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete R.drop[b.dataset.rm];save();redo()});
  const ef=$('#evfill');if(ef)ef.onclick=()=>{DB.students.forEach(s=>{setp(R,'ev|'+s.id+'|c',getp(R,'ev|'+s.id+'|c')||'B');setp(R,'ev|'+s.id+'|s',getp(R,'ev|'+s.id+'|s')||'B')});save();redo()};
  const pap=$('#paper'),wrap=$('.paperwrap');
  const fit=()=>{pap.style.zoom=1;const r=(wrap.clientWidth-28)/pap.offsetWidth;if(r<1)pap.style.zoom=r};fit();
  let tm=null;pap.addEventListener('input',e=>{const t=e.target.closest('[data-p]');if(!t||RO)return;setp(R,t.dataset.p,t.innerText.trim());clearTimeout(tm);tm=setTimeout(save,500)});
  $('#rcopy').onclick=copyDoc;
  $('#rprint').onclick=()=>{let s=$('#pgst');if(!s){s=document.createElement('style');s.id='pgst';document.head.append(s)}
    s.textContent=`@page{size:A4 ${sec.o==='l'?'landscape':'portrait'};margin:12mm}`;try{window.print()}catch(e){}toast('បើមិនចេញផ្ទាំងបោះពុម្ព សូមចម្លងទៅ Word រួចបោះពុម្ពពីទីនោះ')};
}};
})();
</script>
<script>
/* ---------- ផែនការ និងរបាយការណ៍បង្រៀនរបស់គ្រូមុខវិជ្ជា (៣ឆ្នាំ · ១ឆ្នាំ · ៣ខែ) ---------- */
(function(){
const sty=document.createElement('style');sty.textContent='#paper td .ed:empty:before{content:"……"}#paper td .ed{min-width:14px}';document.head.appendChild(sty);
const LV=['A','B','C','D','E','F'];
const MAPQ={q1:[['ចុងខែវិច្ឆិកា','m1'],['ចុងខែធ្នូ','m2'],['ចុងខែមករា','m3']],q2:[['ចុងខែកុម្ភៈ','m4'],['ចុងខែមីនា','m5'],['ចុងខែមេសា','m6']],q3:[['ចុងខែឧសភា','m7'],['ចុងខែមិថុនា','m8'],['ចុងខែកក្កដា','m9']],q4:[['ចុងខែសីហា',null],['ចុងខែកញ្ញា',null],['ចុងខែតុលា',null]]};
let S={i:0,tab:'y3'};
const getp=(o,p)=>p.split('|').reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const ks=p.split('|');let a=o;ks.slice(0,-1).forEach(k=>a=a[k]??={});a[ks[ks.length-1]]=v};
const pairs=()=>{
  if(ROLE==='subject')return ROOT.classes.filter(c=>c.published!==false).map(c=>({c,b:subjOf(c,SUBJT)})).filter(x=>x.b);
  return CUR.subjects.map(b=>({c:CUR,b}));
};
function dist(c,b,col){ /* grade counts for subject b in class c at column col ('y' = yearly avg) */
  const d=Object.fromEntries(LV.map(l=>[l,0]));let n=0;
  c.students.forEach(s=>{const o=c.scores[s.id]?.[b.id];if(!o)return;let v;
    if(col==='y'){const a=Object.values(o).filter(x=>x!==''&&x!=null).map(Number);v=a.length?a.reduce((p,q)=>p+q,0)/a.length:null}
    else v=o[col]===undefined||o[col]===''?null:+o[col];
    if(v==null||isNaN(v))return;d[grade(v)[1]]++;n++});
  return {d,n};
}
const firstCol=(c,b)=>{for(const x of COLS){if(dist(c,b,x.k).n)return x.k}return null};
const lastCol=(c,b)=>{for(let i=COLS.length-1;i>=0;i--){if(dist(c,b,COLS[i].k).n)return COLS[i].k}return null};
const pct=(n,t)=>t?String(Math.round(n/t*1000)/10):'';
function fillAuto(R,c,b){
  const fc=firstCol(c,b),lc=lastCol(c,b);if(!fc)return false;
  const put=(pre,r)=>{LV.forEach(l=>{setp(R,pre+'|'+l+'|p',pct(r.d[l],r.n));setp(R,pre+'|'+l+'|n',String(r.d[l]));});setp(R,pre+'|T|n',String(r.n))};
  const base=dist(c,b,fc);
  ['y3','y1'].forEach(t=>put(t+'|base',base));
  put('y3|1',dist(c,b,'y'));put('y1|end',dist(c,b,'y'));
  Object.keys(MAPQ).forEach(q=>{put(q+'|base',base);let lastR=null;MAPQ[q].forEach(([,k],j)=>{if(k){const r=dist(c,b,k);put(q+'|'+j,r);if(r.n)lastR=r}});if(lastR)LV.forEach(l=>setp(R,q+'|end|'+l,lastR.d[l]+' ('+pct(lastR.d[l],lastR.n)+'%)'));setp(R,q+'|end|T|n',lastR?String(lastR.n):'')});
  return true;
}
function build(c,b,tab,R){
  const ed=(p,def='')=>`<span class="ed" ${RO?'':'contenteditable="true"'} data-p="${esc(p)}">${esc(getp(R,p)??def)}</span>`;
  const girls=c.students.filter(s=>s.sex==='ស្រី').length;
  const tn=ROLE==='subject'?SUBJT.name:'',tp=ROLE==='subject'?SUBJT.phone||'':'';
  const per=ROOT.settings.year;
  const title={y3:`ផែនការ និងរបាយការណ៍បង្រៀន ៣ ឆ្នាំរបស់គ្រូមុខវិជ្ជា (${esc(per)})`,y1:`ផែនការ និងរបាយការណ៍បង្រៀន ១ ឆ្នាំរបស់គ្រូមុខវិជ្ជា (${esc(per)})`,m3:`ផែនការ និងរបាយការណ៍បង្រៀន ៣ ខែរបស់គ្រូមុខវិជ្ជា (${esc(per)})`}[tab];
  const cell=(p,al='center')=>TC(`${ed(p+'|p')}% = ${ed(p+'|n')}នាក់`,al);
  const lvDesc=`កម្រិតពិន្ទុ៖ ${GR.slice().reverse().map(g=>`${g[1]}=${g[0]===0?'ក្រោម ៥':'ពី '+kh(g[0])+(g[1]==='A'?'–១០':'')}`).join(' &nbsp; ')} (មាត្រដ្ឋាន ១០)`;
  const head=docHeader(title,'')+`<div style="font-size:12.5px;line-height:2;margin:4px 0">
    ថ្នាក់ទី៖ <b>${esc(c.name)}</b> &nbsp; មុខវិជ្ជា៖ <b>${esc(b.name)}</b> &nbsp; ចំនួនសិស្សសរុប៖ <b>${kh(c.students.length)}</b> នាក់ &nbsp; ស្រី៖ <b>${kh(girls)}</b> នាក់<br>
    ឈ្មោះគ្រូបង្រៀន៖ ${ed('sp|'+b.id+'|tn',tn)} &nbsp; ហត្ថលេខា ${ed('sp|'+b.id+'|ts')} &nbsp; លេខទូរស័ព្ទ៖ ${ed('sp|'+b.id+'|tt',tp)}<br>
    ឈ្មោះនាយករងបច្ចេកទេស៖ ${ed('sp|'+b.id+'|vn')} &nbsp; ហត្ថលេខា ${ed('sp|'+b.id+'|vs')} &nbsp; លេខទូរស័ព្ទ៖ ${ed('sp|'+b.id+'|vt')}<br>
    <span style="font-size:11.5px">${lvDesc}</span></div>`;
  const K=t=>'sp|'+b.id+'|'+t;
  const totRow=(cols)=>`<tr>${TC('<b>សរុប</b>','center','" colspan="2')}${cols.map(p=>TC(ed(K(p+'|T|n')),'center')).join('')}${TC('')}</tr>`;
  let body='';
  if(tab==='y3'){
    body=`<table style="${TS};table-layout:fixed;font-size:11px"><thead><tr>${TH('មុខវិជ្ជា','" rowspan="2')}${TH('កម្រិត','" rowspan="2')}${TH('ទិន្នន័យដំបូង','" rowspan="2')}${TH('ឆ្នាំទី១')}${TH('ឆ្នាំទី២')}${TH('ឆ្នាំទី៣')}${TH('សម្គាល់','" rowspan="2')}</tr>
    <tr>${[0,1,2].map(i=>TH(ed(K('y3|yr'+i),kh((parseInt(unKh(per).replace(/\D/g,'').slice(0,4))||2026)+i))).replace('</th>','</th>')).join('')}</tr></thead><tbody>
    ${LV.map((l,i)=>`<tr>${i===0?TC(`<b>${esc(b.name)}</b>`,'center',`" rowspan="7`):''}${TC('<b>'+l+'</b>','center')}${TC(`${ed(K('y3|base|'+l+'|n'))}`,'center')}${[1,2,3].map(y=>cell(K('y3|'+y+'|'+l))).join('')}${TC(ed(K('y3|'+l+'|rm')))}</tr>`).join('')}
    <tr>${TC('<b>សរុប</b>','center')}${TC(ed(K('y3|base|T|n')),'center')}${[1,2,3].map(y=>TC(ed(K('y3|'+y+'|T|n')),'center')).join('')}${TC('')}</tr></tbody></table>`;
  }else if(tab==='y1'){
    body=`<table style="${TS};table-layout:fixed;font-size:11px"><thead><tr>${TH('មុខវិជ្ជា')}${TH('កម្រិត')}${TH('ទិន្នន័យដំបូង')}${TH('ចំនួន និង % ចុងឆ្នាំ')}${TH('សម្គាល់')}</tr></thead><tbody>
    ${LV.map((l,i)=>`<tr>${i===0?TC(`<b>${esc(b.name)}</b>`,'center',`" rowspan="7`):''}${TC('<b>'+l+'</b>','center')}${TC(ed(K('y1|base|'+l+'|n')),'center')}${cell(K('y1|end|'+l))}${TC(ed(K('y1|'+l+'|rm')))}</tr>`).join('')}
    <tr>${TC('<b>សរុប</b>','center')}${TC(ed(K('y1|base|T|n')),'center')}${TC(ed(K('y1|end|T|n')),'center')}${TC('')}</tr></tbody></table>`;
  }else{
    body=['q1','q2','q3','q4'].map((q,qi)=>`<table style="${TS};table-layout:fixed;font-size:11px;${qi?'margin-top:14px':''}"><thead><tr>${TH('កម្រិត','" rowspan="2')}${TH('ចំនួន និង %','" colspan="4')}${TH('ចំនួន និង % ចុងត្រីមាសទី'+kh(qi+1),'" rowspan="2')}${TH('សម្គាល់','" rowspan="2')}</tr>
      <tr>${TH('ទិន្នន័យដំបូង')}${MAPQ[q].map(m=>TH(m[0])).join('')}</tr></thead><tbody>
      ${LV.map(l=>`<tr>${TC('<b>'+l+'</b>','center')}${TC(ed(K(q+'|base|'+l+'|n')),'center')}${[0,1,2].map(j=>TC(ed(K(q+'|'+j+'|'+l+'|n')),'center')).join('')}${TC(ed(K(q+'|end|'+l)),'center')}${TC(ed(K(q+'|'+l+'|rm')))}</tr>`).join('')}
      <tr>${TC('<b>សរុប</b>','center')}${TC(ed(K(q+'|base|T|n')),'center')}${[0,1,2].map(j=>TC(ed(K(q+'|'+j+'|T|n')),'center')).join('')}${TC(ed(K(q+'|end|T|n')),'center')}${TC('')}</tr></tbody></table>`).join('');
  }
  const s=ROOT.settings,pl=dots(s.place,'………');
  const foot=`<table style="width:100%;table-layout:fixed;word-break:break-word;border-collapse:collapse;color:#000;margin-top:16px;font-size:11px"><tr>
    <td style="text-align:center;vertical-align:top;width:33%">${pl} ${khLong()}<br><b>អ្នកទទួលបន្ទុក</b><div style="height:50px"></div>${dots(tn)}</td>
    <td style="text-align:center;vertical-align:top;width:33%">${pl} ${khLong()}<br>បានឃើញ និងឯកភាព<br><b>នាយកសាលា</b><div style="height:40px"></div>${dots(s.principal)}</td>
    <td style="text-align:center;vertical-align:top;width:34%">${dots(s.district?('ស្រុក'+s.district):'')} ${khLong()}<br>បានឃើញ និងអនុម័ត<br><b>ប្រធានគណៈកម្មការគ្រប់គ្រងសាលារៀន</b><div style="height:40px"></div>&nbsp;</td></tr></table>`;
  return head+body+foot;
}

  const P=pairs();
  if(!P.length){el.innerHTML='<div class="page"><div class="card empty">មិនមានមុខវិជ្ជាសម្រាប់បង្កើតផែនការ</div></div>';return}
  if(S.i>=P.length)S.i=0;
  const draw=()=>{
    const {c,b}=P[S.i];c.rep??={};c.rep.sp??={};const R=c.rep.sp;

    ${RO?'':'<button class="btn pri" id="spfill">⚡ បំពេញពីពិន្ទុជាក់ស្តែង</button>'}<button class="btn" id="spcopy">📋 ចម្លងទៅ Word / Excel</button><button class="btn" id="spprint">🖨 បោះពុម្ព</button></div>

    <p class="noprint" style="color:var(--muted);font-size:13px">ប៊ូតុង “បំពេញពីពិន្ទុជាក់ស្តែង” គណនាចំនួន និង % តាមនិទ្ទេស A–F ពីពិន្ទុដែលបានបញ្ចូល (ទិន្នន័យដំបូង = ខែដំបូងដែលមានពិន្ទុ)។ ប្រអប់ពណ៌លឿងអាចចុចកែបាន។ ត្រីមាសទី៤ (សីហា–តុលា) បញ្ចូលដោយដៃ។</p></div>`;
    el.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{S.tab=x.dataset.t;draw()});
    $('#spi').onchange=e=>{S.i=+e.target.value;draw()};
    const f=$('#spfill');if(f)f.onclick=()=>{if(!fillAuto2(c,b)){toast('មិនទាន់មានពិន្ទុ');return}save();draw();toast('បានបំពេញ')};
    const pap=$('#paper'),wrap=$('.paperwrap');const fit=()=>{pap.style.zoom=1;const r=(wrap.clientWidth-28)/pap.offsetWidth;if(r<1)pap.style.zoom=r};fit();
    let tm=null;pap.addEventListener('input',e=>{const t=e.target.closest('[data-p]');if(!t||RO)return;setp(c.rep,t.dataset.p,t.innerText.trim());clearTimeout(tm);tm=setTimeout(save,500)});
    $('#spcopy').onclick=copyDoc;
    $('#spprint').onclick=()=>{let s=$('#pgst');if(!s){s=document.createElement('style');s.id='pgst';document.head.append(s)}s.textContent='@page{size:A4 portrait;margin:12mm}';try{window.print()}catch(e){}toast('បើមិនចេញផ្ទាំងបោះពុម្ព សូមចម្លងទៅ Word រួចបោះពុម្ពពីទីនោះ')};
  };
  const fillAuto2=(c,b)=>{const T={};const ok=fillAuto(T,c,b);if(!ok)return false;
    const flat=(o,pre)=>{Object.entries(o).forEach(([k,v])=>{if(v&&typeof v==='object')flat(v,pre+k+'|');else setp(c.rep,'sp|'+b.id+'|'+pre+k,v)})};flat(T,'');return true};
  draw();
}};
})();

<script data-digital-class-sync>
/* Digital Classroom: the master Sheet is the only source of student identity.
 * Scores and attendance remain in this browser; this bridge never writes Students. */
(() => {
  'use strict';
  const endpoint = 'https://script.google.com/macros/s/AKfycbyc_1v8DBczUTac1CprLsj2Ae5uKt8In-XGpB6lXXmCZj7Mm-4OL1DPSJjNXsD-G2GK/exec';
  const backupKey = KEY + '-before-live-roster';
  const loginButton = document.querySelector('#loginForm [type="submit"]');
  const originalLogout = logout;
  const initialLocal = load();
  const classCache = new Map((initialLocal?.classes || []).map(c => [clsKey(c.sheetClassName || c.name), c]));
  let availableClasses = [];
  let token = '', revision = '', activeRole = '', checking = false;
  loginButton.disabled = true;
  HINTS.teacher = 'ប្រើលេខកូដគ្រូតាមថ្នាក់ដែលបានកំណត់ក្នុង Teacher Portal';
  HINTS.admin = 'ប្រើលេខកូដរដ្ឋបាលរបស់ Teacher Portal';
  const status = document.createElement('div');
  status.id = 'studentSheetStatus';
  status.setAttribute('role', 'status');
  status.setAttribute('aria-live', 'polite');
  status.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:90;max-width:min(370px,calc(100vw - 24px));padding:9px 13px;border-radius:12px;background:#eef9f4;color:#08513e;box-shadow:0 4px 20px #0002;font-size:13px';
  document.body.append(status);
  function show(message, problem=false) {
    status.textContent = message;
    status.style.background = problem ? '#fff1f0' : '#eef9f4';
    status.style.color = problem ? '#9a241e' : '#08513e';
  }
  show('កំពុងភ្ជាប់បញ្ជីសិស្សពី Google Sheet…');
  for (const button of document.querySelectorAll('#roleSeg button[data-r]')) {
    if (!['teacher','admin'].includes(button.dataset.r)) {
      button.disabled = true;
      button.title = 'តួនាទីនេះមិនទាន់មានសិទ្ធិចូលប្រើបញ្ជីសិស្សរួម';
    }
  }
  function nonce() {
    return Array.from(crypto.getRandomValues(new Uint8Array(32)), byte => byte.toString(16).padStart(2,'0')).join('');
  }
  function query(action, params={}) {
    return new Promise((resolve, reject) => {
      const callback = 'digitalClassCb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const tag = document.createElement('script');
      const url = new URL(endpoint);
      url.searchParams.set('action', action);
      url.searchParams.set('callback', callback);
      Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, String(value)));
      tag.referrerPolicy = 'no-referrer';
      let done = false;
      const finish = (error, data) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        tag.remove();
        delete window[callback];
        error ? reject(error) : resolve(data);
      };
      const timer = setTimeout(() => finish(new Error('Google Sheet មិនបានឆ្លើយតប')), 30000);
      window[callback] = data => finish(data?.ok ? null : new Error(data?.error || 'មិនអាចទាញទិន្នន័យ'), data);
      tag.onerror = () => finish(new Error('មិនអាចភ្ជាប់ Google Sheet'));
      tag.src = url.toString();
      document.head.append(tag);
    });
  }
  async function post(body) {
    await fetch(endpoint, {method:'POST', mode:'no-cors', credentials:'omit',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  }
  function backupLocal() {
    const current = localStorage.getItem(KEY);
    if (current && !localStorage.getItem(backupKey)) {
      try { localStorage.setItem(backupKey, current); }
      catch (_) { throw new Error('មិនអាចបម្រុងទុកទិន្នន័យចាស់ក្នុងឧបករណ៍នេះ។ សូមបង្កើត Backup មុន'); }
    }
  }
  function codeOf(student) { return String(student?.studentCode || student?.note || '').trim(); }
  function normalizedClass(name) { return clsKey(String(name || '')); }
  function mergeRoster(snapshot, base) {
    if (!snapshot || !Array.isArray(snapshot.classes)) throw new Error('ទិន្នន័យសិស្សមិនត្រឹមត្រូវ');
    const old = base && Array.isArray(base.classes) ? base : {settings:{},classes:[],teachers:[],notices:[]};
    const next = {...old, settings:{...old.settings}, classes:[]};
    for (const entry of snapshot.classes) {
      const className = String(entry.className || '').trim();
      if (!className || !Array.isArray(entry.students)) throw new Error('ព័ត៌មានថ្នាក់មិនត្រឹមត្រូវ');
      const previous = old.classes.find(c => normalizedClass(c.sheetClassName || c.name) === normalizedClass(className));
      const c = previous ? {...previous} : emptyClass('ថ្នាក់ទី ' + className, '');
      c.id = previous?.id || 'sheet:' + className;
      c.name = previous?.name || 'ថ្នាក់ទី ' + className;
      c.sheetClassName = className;
      c.scores = {...(previous?.scores || {})};
      c.att = {...(previous?.att || {})};
      const prior = previous?.students || [];
      const byId = new Map(prior.map(s => [String(s.id),s]));
      const byCode = new Map();
      prior.forEach(s => {const code = codeOf(s); if (code) byCode.set(code, byCode.has(code) ? null : s);});
      const seen = new Set();
      c.students = entry.students.map(row => {
        const id = String(row.id || '').trim();
        const code = String(row.studentCode || '').trim();
        if (!id || seen.has(id)) throw new Error('អត្តលេខសិស្សស្ទួន ឬទទេក្នុង Sheet');
        seen.add(id);
        const matched = byId.get(id) || (code ? byCode.get(code) : null);
        if (matched && matched.id !== id) {
          if (c.scores[matched.id] && !c.scores[id]) c.scores[id] = c.scores[matched.id];
          Object.values(c.att).forEach(day => {if (day && day[matched.id] && !day[id]) day[id] = day[matched.id];});
        }
        return {...(matched || {}), id, studentCode:code,
          name:String(row.studentName || '').trim(), sex:String(row.gender || '').trim(),
          dob:normDob(row.dob || ''), guardian:String(row.guardianName || row.fatherName || row.motherName || '').trim(),
          phone:String(row.contact || '').trim()};
      });
      next.classes.push(c);
    }
    if (!next.classes.length) next.classes.push(emptyClass('មិនទាន់មានថ្នាក់',''));
    next.sheetSource = {revision:String(snapshot.revision || ''),syncedAt:new Date().toISOString()};
    return next;
  }
  function applySnapshot(snapshot, first=false) {
    backupLocal();
    const previousClass = first ? snapshot.className : (CUR?.sheetClassName || CUR?.name);
    const base = first ? {...(initialLocal || ROOT), classes:[...classCache.values()]} : ROOT;
    ROOT = mergeRoster(snapshot, base);
    ROOT.classes.forEach(c => classCache.set(normalizedClass(c.sheetClassName || c.name), c));
    const selected = ROOT.classes.find(c => normalizedClass(c.sheetClassName || c.name) === normalizedClass(previousClass)) || ROOT.classes[0];
    bind(selected.id);
    revision = String(snapshot.revision || '');
    save();
    fillClassSelect();
    loginHero();
    if (!first) render();
    show('បញ្ជីសិស្សដូច Google Sheet · ពិន្ទុ និងវត្តមាននៅឧបករណ៍នេះ');
  }
  const rosterEditSelectors = {
    sstudents:'#addS,[data-e],[data-d],[data-mv]',
    people:'#add,[data-e],[data-d]',
    classes:'#addC,[data-x],[data-n],[data-pub]'
  };
  function lockRosterEdits() {
    if (!token) return;
    const selector = rosterEditSelectors[cur];
    if (!selector) return;
    document.querySelector('#content')?.querySelectorAll(selector).forEach(node => {
      if (node.matches('input,select')) node.disabled = true;
      else node.remove();
    });
  }
  new MutationObserver(lockRosterEdits).observe(document.querySelector('#content'), {childList:true,subtree:true});
  function showAvailableClasses() {
    ROOT.classes = availableClasses.map(item => {
      const c = emptyClass('ថ្នាក់ទី ' + item.className, '');
      c.id = 'sheet:' + item.className;
      c.sheetClassName = item.className;
      return c;
    });
    if (!ROOT.classes.length) ROOT.classes = [emptyClass('មិនទាន់មានថ្នាក់','')];
    bind(ROOT.classes[0].id);
    fillClassSelect(); loginHero(); setRole('teacher');
  }
  logout = function syncedLogout() {
    if (token) ROOT.classes.forEach(c => classCache.set(normalizedClass(c.sheetClassName || c.name), c));
    token = ''; activeRole = ''; revision = '';
    originalLogout();
    showAvailableClasses();
    show('បានចាកចេញ · សូមចូលដោយលេខកូដ Teacher Portal');
  };
  document.querySelector('#loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    event.stopImmediatePropagation();
    if (!['teacher','admin'].includes(loginRole)) return;
    loginButton.disabled = true;
    $('#loginErr').textContent = '';
    try {
      const requestId = nonce();
      const chosen = ROOT.classes.find(c => c.id === $('#loginClass').value);
      const className = loginRole === 'teacher' ? String(chosen?.sheetClassName || '').trim() : '';
      if (loginRole === 'teacher' && !className) throw new Error('សូមជ្រើសរើសថ្នាក់');
      await post({action:'digitalclasslogin', role:loginRole, className, pin:$('#pw').value, nonce:requestId});
      const claim = await query('digitalclassclaim', {nonce:requestId});
      token = claim.token;
      const roster = await query('digitalclassroster', {token});
      activeRole = loginRole;
      applySnapshot(roster, true);
      ROLE = activeRole; VIEWCLASS = null; RO = false;
      $('#pw').value = '';
      $('#login').hidden = true; $('#app').hidden = false;
      location.hash = ''; render(); lockRosterEdits();
    } catch (error) {
      token = '';
      $('#loginErr').textContent = error.message || String(error);
      show('មិនអាចភ្ជាប់បញ្ជីសិស្ស៖ ' + $('#loginErr').textContent, true);
    } finally { loginButton.disabled = false; }
  }, true);
  async function ready() {
    try {
      const result = await query('digitalclassstatus');
      if (!result.readOnly || Number(result.version) < 1) throw new Error('Server មិនទាន់មានមុខងារនេះ');
      const listing = await query('digitalclassclasses');
      availableClasses = listing.classes;
      showAvailableClasses();
      loginButton.disabled = false;
      show('បានភ្ជាប់ Google Sheet · សូមចូលដោយលេខកូដ Teacher Portal');
    } catch (error) { show('មិនទាន់ភ្ជាប់ Google Sheet៖ ' + error.message, true); }
  }
  setInterval(async () => {
    if (!token || checking) return;
    const active = document.activeElement;
    if (active?.closest('#content') && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
    checking = true;
    try {
      const latest = await query('digitalclassrevision', {token});
      if (String(latest.revision || '') !== revision) applySnapshot(await query('digitalclassroster',{token}));
    } catch (error) { show('ធ្វើបច្ចុប្បន្នភាពបញ្ជីសិស្សមិនបាន៖ ' + error.message, true); }
    finally { checking = false; }
  }, 30000);
  void ready();
})();

</script>
